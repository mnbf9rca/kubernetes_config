# The build half of .github/workflows/influxdb-mcp-image.yml, in one place
# because two jobs run it: `build` on every pull request and master push, and
# `promote`'s fallback when the image the pull request should have built is not
# in the registry. Duplicating it is how the two copies drift, and this
# repository's answer to a deliberate copy is an enforced parity guard - more
# machinery than sharing the steps outright.
#
# Self-contained on purpose: it logs in and installs cosign itself, so a caller
# cannot earn a confusing push failure by forgetting either. `promote` already
# has both by the time it reaches the fallback; doing them again is idempotent
# and costs seconds on the path that is already the slow one.
#
# THE SHELL LIVES IN *.sh NEXT TO THIS FILE. actionlint lints workflows and does
# NOT reach a composite action's `run:` bodies - verified, not assumed - so an
# inline block here would be the one piece of shell in the repository that
# nothing checks, which is precisely the hole the `lint` job exists to close.
# `make check-workflows` and that job shellcheck this directory.
name: Build, push and sign
description: Build the influxdb-mcp image, assert its guidance hook, then optionally push and sign it.

inputs:
  image:
    description: Fully qualified image reference to build, push and sign.
    required: true
  push:
    description: >-
      "true" to log in to GHCR, push, and sign the pushed digest. Anything else
      builds and asserts only, which is all a fork's read-only token can do.
    required: true
  token:
    description: Token for the GHCR login. Composite actions cannot read `secrets`, so the caller passes it in.
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    # Built once, loaded into the local daemon, and asserted BEFORE anything is
    # pushed - on master as well as on a pull request.
    - name: Build
      uses: docker/build-push-action@v7
      with:
        context: homelab/health/mcp
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ inputs.image }}

    - name: Assert the guidance tool is registered
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: ${{ github.action_path }}/assert-tool.sh

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Install cosign
      if: inputs.push == 'true'
      uses: sigstore/cosign-installer@v4.1.2

    # NOTHING VERIFIES THE SIGNATURE AT ADMISSION - neither cluster runs a
    # policy controller - so `promote`'s `cosign verify` of `stable` is the only
    # automatic check; provenance is otherwise checked by hand.
    - name: Push and sign
      if: inputs.push == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: ${{ github.action_path }}/push-and-sign.sh
