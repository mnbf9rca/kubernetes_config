# The only workflow in this repository. It builds ghcr.io/mnbf9rca/influxdb-mcp-server
# from homelab/health/mcp/.
#
# BUILD ON THE PULL REQUEST, PROMOTE ON MERGE. The image is named by its
# CONTENT - `tree-<hash>` - so the pull request builds, pushes and signs the
# exact artifact that master will later run, and merging only moves a tag.
#
#   On a pull request: `changes`, `lint`, `build`. The image is built, its
#   guidance hook asserted, then pushed and signed. `build` runs ONLY here.
#
#   On a push to master: `changes`, `lint`, `promote`. `build` is skipped by its
#   own `if:`, so a merge cannot rebuild: it verifies the signature on the image
#   the pull request pushed and points `stable` at that same digest. What master
#   delivers is bit-for-bit what was reviewed, by the same signature.
#
# NOTHING BUILDS ON MASTER. The master-only surface is exactly the `promote`
# job's login, inspect, verify and retag - four steps, none of which builds,
# pushes or signs anything. There is no fallback build: if the image is not in
# the registry, `promote` FAILS and says to open a pull request that touches
# homelab/health/mcp/. A direct push to master is not this repository's
# practice, and a fallback would be master-only code no pull request ever runs -
# the exact thing this design exists to remove.
#
# `promote` runs on EVERY master push, including one where `changes` said the
# inputs did not move: the retag is cheap and idempotent, and skipping it would
# leave `stable` behind after a squash that did change the tree.
#
# WHY THE HASH COVERS THIS FILE. The build inputs are the mcp directory's tree
# object AND this workflow's own blob, because a change to the build steps must
# produce a different image even when homelab/health/mcp/ is byte-identical -
# otherwise `promote` would retag `stable` onto an image the old steps built and
# the change would silently never ship.
#
# WHY THE HASH MATCHES ACROSS THE MERGE. On a pull request GitHub runs the
# workflow against the merge commit, whose tree is what a squash merge writes to
# master, so the master run computes the same hash and finds the image.
#
# SO A PULL REQUEST WHOSE BASE HAS MOVED MUST RE-RUN BEFORE IT MERGES. Once
# master advances, the squash tree can differ from the merge commit the last run
# saw, the hash changes, and `promote` fails on a missing tag. GitHub's "Update
# branch" button re-triggers this workflow, which is both the fix and the
# prevention.
#
# A FORK'S PULL REQUEST gets a read-only GITHUB_TOKEN, so `build` builds and
# asserts but pushes nothing, and its merge would fail in `promote`. Land such a
# contribution by branching it inside this repository and opening a pull request
# from there.
#
# REQUIRED STATUS CHECKS ON MASTER: `lint` and `build`. Both, not just `build`:
# a job skipped because a dependency failed still satisfies a required check, so
# `build`'s `needs: lint` does not make a lint failure block a merge.
#
# NO workflow_dispatch. Every input is pinned and the lockfile is committed, so
# a manual run would rebuild what the last run already pushed; retrying a failed
# push is GitHub's own re-run button on the run that failed.
#
# A ROLLBACK IS NOT A TAG EDIT. check-renovate-scope reads a pinned reference
# under a complete keel annotation set as the frozen state and hard-fails
# apply-homelab, so pointing the Deployment at tree-<hash> means stripping the
# keel annotations in the same emergency edit. The rollback is what every other
# update here does: revert the build input, let the merge promote the image, and
# keel delivers it.
#
# THE TRIGGERS CARRY NO paths: FILTER AND THE PATH CONDITION LIVES IN THE
# `changes` JOB, so that `build` can be a required status check on master.
# GitHub treats a job skipped by its own `if:` as satisfying a required check,
# but a workflow that a paths filter never triggered reports nothing at all -
# and a required check that never reports blocks the pull request forever.
name: influxdb-mcp image

on:
  push:
    branches: [master]
  pull_request:

# Read-only by default; the two jobs that touch the registry widen it
# themselves. Login uses the job's own GITHUB_TOKEN; no secret is added to the
# repository - the signing key is an ephemeral OIDC identity, not stored.
permissions:
  contents: read

jobs:
  # The paths filter the triggers no longer carry, and the content hash that
  # names the image. Plain git: the comparison is a two-dot diff on a push and a
  # three-dot diff against the merge base on a pull request, and a push with no
  # usable `before` - a new branch, or a force push that orphaned the old tip -
  # counts as changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mcp: ${{ steps.filter.outputs.mcp }}
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the image inputs changed
        id: filter
        # Through the environment, not through ${{ }} interpolation into the
        # script body.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "null" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE..$SHA")
          else
            echo "no usable before-sha ('$BEFORE'): treating as changed"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$files"
          # grep, not grep -q: -q closes the pipe on the first match, and under
          # pipefail printf's EPIPE would then read as "no match".
          if printf '%s\n' "$files" \
             | grep -E '^(homelab/health/mcp/|\.github/workflows/influxdb-mcp-image\.yml$)' \
             > /dev/null; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

      # Both inputs are printed, because when `promote` misses its tag the first
      # question is which of the two moved between the pull request and master.
      - name: Name the image by its content
        id: hash
        run: |
          set -euo pipefail
          mcp=$(git rev-parse "HEAD:homelab/health/mcp")
          workflow=$(git rev-parse "HEAD:.github/workflows/influxdb-mcp-image.yml")
          hash=$(printf '%s%s' "$mcp" "$workflow" | sha256sum | cut -c1-12)
          echo "mcp tree:      $mcp"
          echo "workflow blob: $workflow"
          echo "image hash:    $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  # Nothing else lints the inline shell in this file, which is how a `for` loop
  # over a multi-line output reached master and broke the first push. actionlint
  # parses the workflow and runs shellcheck over every `run:` body, so it is
  # unconditional and ungated: it takes seconds and it is what catches that
  # class. Values still reach a script through `env:`, never by interpolating a
  # multi-line output into the script body. `make check-workflows` runs the same
  # thing by hand.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The official image, pinned; it ships shellcheck. With no file arguments
      # actionlint lints every workflow in .github/workflows.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=shellcheck

  # PULL REQUESTS ONLY. On a master push this is skipped and `promote`'s
  # fallback is the sole builder, so a merge can never overwrite an existing
  # tree tag with a fresh, non-reproducible rebuild of the same inputs.
  build:
    needs: [changes, lint]
    if: github.event_name == 'pull_request' && needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/mnbf9rca/influxdb-mcp-server:tree-${{ needs.changes.outputs.hash }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Built once, loaded into the local daemon, and asserted BEFORE anything
      # is pushed.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: homelab/health/mcp
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      # The one failure mode the guidance hook has: the SDK moved and the patch
      # no longer registers. Nothing in this repository can run a JavaScript
      # test, so this build is the hook's only check. stdio, not --http, because
      # that needs no session id and no SSE parsing. The InfluxDB environment is
      # dummy: the assertion is the tool list, not a query.
      - name: Assert the guidance tool is registered
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 60 docker run -i --rm \
                -e INFLUXDB_URL=http://127.0.0.1:8086 \
                -e INFLUXDB_TOKEN=not-a-real-token \
                -e INFLUXDB_ORG=ci \
                "$IMAGE" > tools.json || true
          cat tools.json
          grep -q 'how-to-use-health-data' tools.json

      # A pull request from a fork gets a read-only GITHUB_TOKEN, so it builds
      # and asserts but cannot push or sign. Landing such a contribution means
      # branching it inside this repository: `promote` has no fallback build.
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless: the signature is made with the job's own OIDC identity and
      # recorded in the public Rekor transparency log, so there is no key to
      # store and none to rotate. It signs the DIGEST, so it survives `promote`
      # retagging that digest as `stable` and keel rewriting the Deployment's.
      #
      # RepoDigests, not `docker buildx imagetools inspect`: `docker push`
      # writes the registry digest back onto the local image, so it is already
      # here and already a full `image@sha256:...` reference.
      #
      # One image, one tag, no loop: the loop over a multi-line tag list
      # interpolated into the script body is what broke the first master push.
      # IMAGE arrives through the environment, and nothing here is multi-line.
      #
      # cosign v3 writes the new bundle format by default, which GHCR stores as
      # an OCI 1.1 referrer. If it ever rejects that, `--new-bundle-format=false`
      # is the switch - here AND on the `cosign verify` in `promote`, or
      # verification looks for a bundle this signature did not write.
      - name: Push and sign
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          cosign sign --yes "$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"

  # id-token: write is for the FALLBACK, which signs the image it had to build.
  # The retag path needs only packages: write.
  #
  # `needs: lint` as well as `changes`: without it a red lint on master still
  # moves `stable`, because promote does not depend on `build` and a failing
  # sibling job does not stop an independent one.
  promote:
    needs: [changes, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # One promotion at a time, and never cancelled: two merges landing together
    # would otherwise race to write `stable`, and the loser could be the newer
    # one. cancel-in-progress: false because a cancelled promote can leave the
    # image pushed and `stable` unmoved.
    concurrency:
      group: promote-stable
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/mnbf9rca/influxdb-mcp-server:tree-${{ needs.changes.outputs.hash }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: imjasonh/setup-crane@v0.7

      # NO FALLBACK BUILD. A missing tag means the pull request never pushed
      # this content - a direct push to master, a fork's pull request, or a base
      # that moved so the squash tree differs from what the last run saw. Each
      # is fixed by opening (or re-running) a pull request, not by master
      # building an image nothing reviewed. A transient registry failure lands
      # here too, and its fix is the re-run button.
      - name: Require the image the pull request built
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$IMAGE"; then
            echo "no image at $IMAGE"
            echo "master does not build. Open a pull request touching homelab/health/mcp/ (or re-run one whose base has moved) so its build pushes and signs this image, then merge it."
            exit 1
          fi

      # BEFORE the retag, never after. Verifying `stable` afterwards reports a
      # bad promotion that has already happened; verifying the tree tag first
      # means an unsigned or foreign image never becomes `stable` at all,
      # because a failure here exits the job with the tag untouched.
      #
      # cosign v3 signs and verifies the new bundle format by default. If GHCR
      # rejects the OCI 1.1 referrer, `--new-bundle-format=false` here and on
      # the `cosign sign` in `build` - both, or verification looks for a bundle
      # the signature did not write.
      - name: Verify the signature before promoting it
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/mnbf9rca/kubernetes_config/\.github/workflows/influxdb-mcp-image\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"

      # crane tag, not docker tag + docker push: it writes a new tag against the
      # digest that is already in the registry. Nothing is rebuilt, no new
      # manifest is created, and the signature just verified on that digest
      # still covers what `stable` now points at - which is why no second
      # verify follows: it would re-check the same digest under another name.
      - name: Point stable at that digest
        run: |
          set -euo pipefail
          crane tag "$IMAGE" stable
