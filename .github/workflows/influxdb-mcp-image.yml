# The only workflow in this repository. It builds ghcr.io/mnbf9rca/influxdb-mcp-server
# from homelab/health/mcp/.
#
# BUILD ON THE PULL REQUEST, PROMOTE ON MERGE. The image is named by its
# CONTENT - `tree-<hash>` - so the pull request builds, pushes and signs the
# exact artifact that master will later run, and merging only moves a tag.
#
#   On a pull request: `changes`, `lint`, `build`. The image is built and its
#   guidance hook asserted; it is pushed and signed too, unless the pull
#   request comes from a fork, whose GITHUB_TOKEN is read-only.
#
#   On a push to master: the same three, plus `promote`. `promote` finds the
#   image the pull request already pushed and points `stable` at that same
#   digest, so what master delivers is bit-for-bit what was reviewed and the
#   signature made on the pull request still covers it.
#
# THE RETAG AND ITS FALLBACK ARE THE ONLY MASTER-ONLY CODE. Everything that
# builds, asserts, pushes and signs is the composite action in
# .github/actions/build-push-sign/, which a pull request exercises in full on
# every run. Nothing in the delivery path is first tried on master.
#
# `promote` runs on EVERY master push, including one where `changes` said the
# inputs did not move: the tag it needs may already exist from an earlier merge
# and the retag is cheap, and the reverse - skipping it - would leave `stable`
# behind after a squash that did change the tree.
#
# WHY THE HASH COVERS THIS FILE. The build inputs are the mcp directory's tree
# object AND this workflow's own blob, because a change to the build steps must
# produce a different image even when homelab/health/mcp/ is byte-identical -
# otherwise `promote` would retag `stable` onto an image the old steps built and
# the change would silently never ship.
#
# WHY THE HASH MATCHES ACROSS THE MERGE. On a pull request GitHub runs the
# workflow against the merge commit, whose tree is what a squash merge writes to
# master, so the master run computes the same hash and finds the image. It stops
# matching when master moved under the branch, or on a direct push to master
# that had no pull request at all - which is exactly when `promote` falls back
# to building the image itself.
#
# REQUIRED STATUS CHECKS ON MASTER: `lint` and `build`. Both, not just `build`:
# a job skipped because a dependency failed still satisfies a required check, so
# `build`'s `needs: lint` does not make a lint failure block a merge.
#
# NO workflow_dispatch. Every input is pinned and the lockfile is committed, so
# a manual run would rebuild what the last run already pushed; retrying a failed
# push is GitHub's own re-run button on the run that failed.
#
# A ROLLBACK IS NOT A TAG EDIT. check-renovate-scope reads a pinned reference
# under a complete keel annotation set as the frozen state and hard-fails
# apply-homelab, so pointing the Deployment at tree-<hash> means stripping the
# keel annotations in the same emergency edit. The rollback is what every other
# update here does: revert the build input, let the merge promote the image, and
# keel delivers it.
#
# THE TRIGGERS CARRY NO paths: FILTER AND THE PATH CONDITION LIVES IN THE
# `changes` JOB, so that `build` can be a required status check on master.
# GitHub treats a job skipped by its own `if:` as satisfying a required check,
# but a workflow that a paths filter never triggered reports nothing at all -
# and a required check that never reports blocks the pull request forever.
name: influxdb-mcp image

on:
  push:
    branches: [master]
  pull_request:

# Read-only by default; the two jobs that touch the registry widen it
# themselves. Login uses the job's own GITHUB_TOKEN; no secret is added to the
# repository - the signing key is an ephemeral OIDC identity, not stored.
permissions:
  contents: read

jobs:
  # The paths filter the triggers no longer carry, and the content hash that
  # names the image. Plain git: the comparison is a two-dot diff on a push and a
  # three-dot diff against the merge base on a pull request, and a push with no
  # usable `before` - a new branch, or a force push that orphaned the old tip -
  # counts as changed.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mcp: ${{ steps.filter.outputs.mcp }}
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the image inputs changed
        id: filter
        # Through the environment, not through ${{ }} interpolation into the
        # script body.
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "null" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE..$SHA")
          else
            echo "no usable before-sha ('$BEFORE'): treating as changed"
            echo "mcp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"
          printf '%s\n' "$files"
          # grep, not grep -q: -q closes the pipe on the first match, and under
          # pipefail printf's EPIPE would then read as "no match".
          if printf '%s\n' "$files" \
             | grep -E '^(homelab/health/mcp/|\.github/workflows/influxdb-mcp-image\.yml$)' \
             > /dev/null; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

      # Both inputs are printed, because when `promote` misses its tag the first
      # question is which of the two moved between the pull request and master.
      - name: Name the image by its content
        id: hash
        run: |
          set -euo pipefail
          mcp=$(git rev-parse "HEAD:homelab/health/mcp")
          workflow=$(git rev-parse "HEAD:.github/workflows/influxdb-mcp-image.yml")
          hash=$(printf '%s%s' "$mcp" "$workflow" | sha256sum | cut -c1-12)
          echo "mcp tree:      $mcp"
          echo "workflow blob: $workflow"
          echo "image hash:    $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  # Nothing else lints the inline shell in this file, which is how a `for` loop
  # over a multi-line output reached master and broke the first push. actionlint
  # parses the workflow and runs shellcheck over every `run:` body, so it is
  # unconditional and ungated: it takes seconds and it is what catches that
  # class. Values still reach a script through `env:`, never by interpolating a
  # multi-line output into the script body. `make check-workflows` runs the same
  # thing by hand.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The official image, pinned; it ships shellcheck. With no file arguments
      # actionlint lints every workflow in .github/workflows.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=shellcheck

      # actionlint reaches workflows only: a composite action's shell is
      # invisible to it, referenced or not (verified). So the composite action
      # keeps its shell in real script files and they are checked here, with the
      # runner's own shellcheck. Without this step the delivery path's shell is
      # the one shell in the repository nothing lints.
      - name: Lint the composite action's shell
        run: shellcheck .github/actions/*/*.sh

  build:
    needs: [changes, lint]
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-push-sign
        with:
          image: ghcr.io/mnbf9rca/influxdb-mcp-server:tree-${{ needs.changes.outputs.hash }}
          # A pull request from a fork gets a read-only GITHUB_TOKEN, so it can
          # build and assert but not push or sign. Everything else can.
          push: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # id-token: write is for the FALLBACK, which signs the image it had to build.
  # The retag path needs only packages: write.
  promote:
    needs: [changes]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: imjasonh/setup-crane@v0.7

      # A transient registry failure reads as "absent" here and costs a rebuild:
      # the fallback pushes a new digest over the same tree tag and signs it, so
      # the wrong branch is slow, never wrong. Retrying is the re-run button.
      - name: Look for the image the pull request built
        id: lookup
        env:
          IMAGE: ghcr.io/mnbf9rca/influxdb-mcp-server:tree-${{ needs.changes.outputs.hash }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "no image at $IMAGE - building it here"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # A direct push to master, or a squash whose tree differs from every pull
      # request head. Same steps the pull request would have run.
      - uses: ./.github/actions/build-push-sign
        if: steps.lookup.outputs.found == 'false'
        with:
          image: ghcr.io/mnbf9rca/influxdb-mcp-server:tree-${{ needs.changes.outputs.hash }}
          push: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}

      # crane tag, not docker tag + docker push: it writes a new tag against the
      # digest that is already in the registry. Nothing is rebuilt, no new
      # manifest is created, and the signature made on that digest still covers
      # what `stable` now points at.
      - name: Point stable at that digest
        env:
          IMAGE: ghcr.io/mnbf9rca/influxdb-mcp-server:tree-${{ needs.changes.outputs.hash }}
        run: |
          set -euo pipefail
          crane tag "$IMAGE" stable

      # The one thing only master does that a pull request never rehearses, so
      # it is kept to a single command: confirm `stable` resolves to a digest
      # this workflow signed. A failure here means the retag landed on something
      # unsigned, and the job fails rather than leaving it unremarked.
      - name: Verify the signature on stable
        env:
          STABLE: ghcr.io/mnbf9rca/influxdb-mcp-server:stable
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/mnbf9rca/kubernetes_config/\.github/workflows/influxdb-mcp-image\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$STABLE"
