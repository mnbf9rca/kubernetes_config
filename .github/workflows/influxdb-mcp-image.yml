# The only workflow in this repository. It builds ghcr.io/mnbf9rca/influxdb-mcp-server
# from homelab/health/mcp/.
#
# BUILD ON THE PULL REQUEST, PROMOTE ON MERGE, AND THE PULL REQUEST EVENT IS
# WHAT CARRIES THE IMAGE BETWEEN THEM. The image is tagged `sha-<head sha>`, and
# the merge run reads that same head sha out of its own event payload, so it
# needs no content hash and no lookup heuristic to know which image the pull
# request built.
#
#   A pull request run (opened, synchronize, reopened): `changes`, `lint`,
#   `build`. The image is built, its guidance hook asserted, then pushed and
#   signed as `sha-<head sha>`.
#
#   THE MERGE RUN (closed, merged == true): `changes`, `promote`. It verifies
#   the signature on `sha-<head sha>` and points `stable` at that digest with
#   `crane tag`. It builds nothing, pushes nothing and signs nothing, so what
#   master delivers is bit-for-bit what was reviewed, under the same signature.
#
# NOTHING BUILDS OUTSIDE A PULL REQUEST. The whole master-only surface is
# `promote`'s login, verify and retag. There is no fallback build: a missing or
# unsigned tag fails the job loudly rather than letting master produce an image
# nobody reviewed.
#
# THERE IS NO push: TRIGGER, so A DIRECT PUSH TO MASTER PROMOTES NOTHING - it
# leaves `stable` where it is, silently, because no run happens at all. Changes
# to the image reach the cluster through a pull request or they do not reach it.
#
# A FORK'S PULL REQUEST gets a read-only GITHUB_TOKEN, so `build` builds and
# asserts but pushes nothing. Its merge therefore fails at `cosign verify` with
# nothing to verify, which is the designed refusal: land a fork's change by
# opening a pull request from a branch inside this repository.
#
# THE IMAGE IS BUILT FROM THE MERGE COMMIT AND TAGGED WITH THE HEAD SHA. That is
# the standard pull-request checkout, and it means a base branch that moves
# after the last run leaves the tag naming a build made against the older base.
# `synchronize` fires on a new head commit, not on a moved base, so the fix is
# the same as the review's: update the branch, which pushes a new head sha and
# rebuilds. The exposure is bounded by how stale the base is allowed to get.
#
# REQUIRED STATUS CHECKS ON MASTER: `lint` and `build`, both of which report on
# a pull request run. Both, not just `build`: a job skipped because a dependency
# failed still satisfies a required check, so `build`'s `needs: lint` does not
# by itself make a lint failure block a merge.
#
# NO workflow_dispatch. Every input is pinned and the lockfile is committed, so
# a manual run would rebuild what the pull request already pushed; retrying a
# failed push is GitHub's own re-run button on the run that failed.
#
# A ROLLBACK IS NOT A TAG EDIT. check-renovate-scope reads a pinned reference
# under a complete keel annotation set as the frozen state and hard-fails
# apply-homelab, so pointing the Deployment at sha-<n> means stripping the keel
# annotations in the same emergency edit. The rollback is what every other
# update here does: revert the build input in a pull request, let the merge
# promote the image, and keel delivers it.
#
# THE TRIGGER CARRIES NO paths: FILTER AND THE PATH CONDITION LIVES IN THE
# `changes` JOB, so that `build` can be a required status check on master.
# GitHub treats a job skipped by its own `if:` as satisfying a required check,
# but a workflow that a paths filter never triggered reports nothing at all -
# and a required check that never reports blocks the pull request forever.
name: influxdb-mcp image

# Pull request events only, `closed` included: the merge is an event on the
# pull request, so promotion needs no push trigger and gets the head sha for
# free.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Read-only by default; the jobs that touch the registry widen it themselves.
# Login uses the job's own GITHUB_TOKEN; no secret is added to the repository -
# the signing key is an ephemeral OIDC identity, not stored.
permissions:
  contents: read

jobs:
  # The paths filter the trigger does not carry. GitHub's own list of the pull
  # request's files IS the merge-base diff, and it needs no checkout - which
  # also sidesteps the merge ref a closed pull request may no longer have.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - name: Decide whether the image inputs changed
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "changed files:"
          printf '%s\n' "$files"
          # grep, not grep -q: -q closes the pipe on the first match, and under
          # pipefail printf's EPIPE would then read as "no match".
          if printf '%s\n' "$files" \
             | grep -E '^(homelab/health/mcp/|\.github/workflows/influxdb-mcp-image\.yml$)' \
             > /dev/null; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi

  # Nothing else lints the inline shell in this file, which is how a `for` loop
  # over a multi-line output reached master and broke the first push. actionlint
  # parses the workflow and runs shellcheck over every `run:` body, so it is
  # unconditional and ungated: it takes seconds and it is what catches that
  # class. Values still reach a script through `env:`, never by interpolating a
  # multi-line output into the script body. `make check-workflows` runs the same
  # thing by hand. Every piece of shell in the delivery path is a `run:` block in
  # this file, which is what keeps that coverage complete.
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The official image, pinned; it ships shellcheck. With no file arguments
      # actionlint lints every workflow in .github/workflows.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck=shellcheck

  build:
    needs: [changes, lint]
    if: github.event.action != 'closed' && needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # GitHub expressions cannot take a substring, so the tag is assembled here
      # and handed to every later step through the environment file.
      - name: Name the image after the head commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/mnbf9rca/influxdb-mcp-server:sha-${HEAD_SHA:0:12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # Built once, loaded into the local daemon, and asserted BEFORE anything
      # is pushed.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: homelab/health/mcp
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}

      # The one failure mode the guidance hook has: the SDK moved and the patch
      # no longer registers. Nothing in this repository can run a JavaScript
      # test, so this build is the hook's only check. stdio, not --http, because
      # that needs no session id and no SSE parsing. The InfluxDB environment is
      # dummy: the assertion is the tool list, not a query.
      - name: Assert the guidance tool is registered
        run: |
          set -euo pipefail
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 60 docker run -i --rm \
                -e INFLUXDB_URL=http://127.0.0.1:8086 \
                -e INFLUXDB_TOKEN=not-a-real-token \
                -e INFLUXDB_ORG=ci \
                "$IMAGE" > tools.json || true
          cat tools.json
          grep -q 'how-to-use-health-data' tools.json

      # A fork's pull request has a read-only GITHUB_TOKEN, so it builds and
      # asserts but cannot push or sign - and its merge then fails in `promote`,
      # deliberately.
      - name: Log in to GHCR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: sigstore/cosign-installer@v4.1.2

      # Keyless: the signature is made with the job's own OIDC identity and
      # recorded in the public Rekor transparency log, so there is no key to
      # store and none to rotate. It signs the DIGEST, so it survives `promote`
      # retagging that digest as `stable` and keel rewriting the Deployment's.
      #
      # RepoDigests, not `docker buildx imagetools inspect`: `docker push`
      # writes the registry digest back onto the local image, so it is already
      # here and already a full `image@sha256:...` reference.
      #
      # One image, one tag, no loop: the loop over a multi-line tag list
      # interpolated into the script body is what broke the first master push.
      # IMAGE arrives through the environment, and nothing here is multi-line.
      #
      # cosign v3 writes the new bundle format by default, which GHCR stores as
      # an OCI 1.1 referrer. If it ever rejects that, `--new-bundle-format=false`
      # is the switch - here AND on the `cosign verify` in `promote`, or
      # verification looks for a bundle this signature did not write.
      - name: Push and sign
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          cosign sign --yes "$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"

  # The merge run. No checkout: nothing here reads the repository.
  promote:
    needs: [changes]
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One promotion at a time, and never cancelled: two merges landing together
    # would otherwise race to write `stable`, and the loser could be the newer
    # one.
    concurrency:
      group: promote-stable
      cancel-in-progress: false
    steps:
      - name: Name the image after the merged head commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "IMAGE=ghcr.io/mnbf9rca/influxdb-mcp-server:sha-${HEAD_SHA:0:12}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: imjasonh/setup-crane@v0.7

      # BEFORE the retag, never after, and it is also the existence check: a tag
      # that was never pushed cannot verify. A same-repo pull request signed
      # this digest; a fork's did not push at all, so this is where that merge
      # stops - loudly, with `stable` untouched.
      #
      # If GHCR ever rejects the OCI 1.1 referrer that cosign v3 writes by
      # default, `--new-bundle-format=false` here AND on the `cosign sign` in
      # `build` - both, or verification looks for a bundle the signature did not
      # write.
      - name: Verify the signature before promoting it
        run: |
          set -euo pipefail
          if ! cosign verify \
            --certificate-identity-regexp '^https://github\.com/mnbf9rca/kubernetes_config/\.github/workflows/influxdb-mcp-image\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"; then
            echo "no verifiable signature on $IMAGE"
            echo "This workflow never builds outside a pull request. A fork's pull request cannot push or sign, so its changes must be re-opened as a pull request from a branch inside this repository; otherwise re-run the pull request's build and merge again."
            exit 1
          fi

      # crane tag, not docker tag + docker push: it writes a new tag against the
      # digest that is already in the registry. Nothing is rebuilt, no new
      # manifest is created, and the signature just verified on that digest
      # still covers what `stable` now points at - which is why no second
      # verify follows: it would re-check the same digest under another name.
      - name: Point stable at that digest
        run: |
          set -euo pipefail
          crane tag "$IMAGE" stable
