apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# populated task-by-task: cloudflared.yaml, influxdb.yaml, apple-health-ingester.yaml,
# garmin-grafana.yaml, grafana.yaml, influxdb-mcp.yaml, backups.yaml,
# ingest-freshness.yaml, cloudflare-analytics.yaml
# (pomerium.yaml retired 2026-08-22: auth moved to a Cloudflare Access app at the
# edge, and the MCP server is a plain Deployment+Service again — influxdb-mcp.yaml)
resources:
  - backups-storage.yaml
  - cloudflared.yaml
  - influxdb.yaml
  - apple-health-ingester.yaml
  - garmin-grafana.yaml
  - grafana.yaml
  - influxdb-mcp.yaml
  - backups.yaml
  - ingest-freshness.yaml
  - cloudflare-analytics.yaml
  - withings-ingest.yaml

# Scripts that run in this namespace live as real files under scripts/ and reach
# the cluster through a generator, never as an inline YAML string: a real file
# can be imported, unit-tested, linted and diffed line by line.
#
# The generated name gets a content-hash suffix and kustomize rewrites every
# reference to it, so editing a script rolls the workload that mounts it instead
# of leaving a stale copy mounted. Do NOT set disableNameSuffixHash here.
#
# The key is the mount filename, not the source filename: cloudflare-analytics
# mounts this ConfigMap at /app and runs /app/ingest.py.
#
# `namespace:` is REQUIRED and is not decoration. A generator inherits no
# namespace from anywhere (this kustomization deliberately sets no top-level
# one), and kustomize only rewrites a name reference when referrer and referent
# agree on namespace. Omit it and you get a silent double failure: the ConfigMap
# is created in `default` AND the CronJob keeps pointing at the unsuffixed name,
# so the mount dangles and every run fails at container start.
#
# GENERATED SCRIPTS ARE NOT INERT TEXT. They ride the same stream as every
# manifest, so envsubst rewrites them too — and it substitutes the bare `$NAME`
# form as well as `${NAME}`. A script here must never mention a name in
# ENVSUBST_VAR_NAMES; `make check-script-substitution` enforces that.
configMapGenerator:
  - name: cloudflare-analytics-script
    namespace: health
    files:
      - ingest.py=scripts/cloudflare-analytics-ingest.py
  # Same shape as the generator above: `namespace: health` is required, the
  # content-hash suffix stays on, and the key is the mount filename.
  - name: withings-ingest-script
    namespace: health
    files:
      - ingest.py=scripts/withings-ingest.py
  # Scheduled-job scripts for this namespace. influx-backup.sh runs in the
  # influx-backup CronJob pod; the two influx-*.sh scripts it ships into the
  # influxdb pod by `sh -c "$(cat ...)"` are keys here too, because the CronJob
  # pod is what has to read them. ingest-freshness.sh is a separate CronJob
  # sharing this one ConfigMap: both are health-namespace scheduled work, and a
  # second generator would buy nothing but another name to keep in sync.
  - name: health-backup-scripts
    namespace: health
    files:
      - influx-backup.sh=scripts/influx-backup.sh
      - influx-native-backup.sh=scripts/influx-native-backup.sh
      - influx-export-lp.sh=scripts/influx-export-lp.sh
      - ingest-freshness.sh=scripts/ingest-freshness.sh
      # Runs in the influx-backup CronJob pod itself, like influx-backup.sh:
      # it reads the grafana-data PVC through that pod's read-only /grafana
      # mount rather than crossing into the grafana pod, which has neither
      # sqlite3 nor python3.
      - grafana-sqlite-backup.py=scripts/grafana-sqlite-backup.py
