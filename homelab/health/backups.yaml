---
apiVersion: v1
kind: ServiceAccount
metadata: { name: health-backup, namespace: health }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: health-backup-exec, namespace: health }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: health-backup-exec, namespace: health }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: health-backup-exec }
subjects: [{ kind: ServiceAccount, name: health-backup, namespace: health }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: influx-backup
  namespace: health
spec:
  schedule: "30 2 * * *"          # before the 03:00 restic sweep
  timeZone: "UTC"                 # without this the schedule is read in kube-controller-manager's local zone
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600   # a missed window is retried for an hour, then skipped (not silently lost forever)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600 # with concurrencyPolicy: Forbid, a hung run would otherwise
                                  # block every subsequent night with nothing alerting
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: health-backup
          containers:
            - name: backup
              # bitnami/kubectl no longer publishes plain version tags (Bitnami moved
              # unauthenticated floating tags to bitnamilegacy/*, frozen since 2025-08-22,
              # capped at 1.33.4 — confirmed via registry API: bitnami/kubectl:1.33 and
              # :1.36 both 404). bitnamilegacy/kubectl:1.33 exists but has neither wget
              # nor curl (verified in-cluster), which the hc-ping step below needs.
              # rancher/kubectl:v1.36.0 exists and matches the server minor but ships no
              # shell at all. alpine/k8s:1.36.0 matches the cluster's server version
              # (v1.36.0) exactly and was verified in-cluster to have kubectl v1.36.0,
              # sh, wget, curl, awk, xargs, date — everything this script needs.
              image: alpine/k8s:1.36.0
              # The script is homelab/health/scripts/influx-backup.sh, mounted at
              # /scripts by the configMapGenerator in this directory's
              # kustomization.yaml. It exec-s two further scripts into the influxdb
              # pod as TEXT (`sh -c "$(cat ...)"`) rather than mounting this
              # ConfigMap there: mounting it into influxdb.yaml would couple that
              # Deployment to the backup ConfigMap and roll influxdb on every script
              # edit.
              command: ["sh", "/scripts/influx-backup.sh"]
              env:
                - name: HC_UUID
                  value: "${HEALTH_HC_BACKUP_UUID}"
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          initContainers:
            - name: mkdirs
              image: busybox:1.37
              command: [sh, -c, "mkdir -p /dumps/native /dumps/lp"]
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
          volumes:
            - name: dumps
              persistentVolumeClaim: { claimName: health-dumps }
            - name: scripts
              configMap: { name: health-backup-scripts }
