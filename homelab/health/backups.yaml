---
apiVersion: v1
kind: ServiceAccount
metadata: { name: health-backup, namespace: health }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: health-backup-exec, namespace: health }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: health-backup-exec, namespace: health }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: health-backup-exec }
subjects: [{ kind: ServiceAccount, name: health-backup, namespace: health }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  # STILL NAMED influx-backup, and it also takes the nightly Grafana SQLite
  # dump. The name is kept because it is the identity of the CronJob, of its
  # uptime-kuma push monitor (`health-influx-backup`) and of every runbook that
  # names it; renaming would orphan the monitor and the history behind it for a
  # cosmetic gain. What the job actually does is one logical backup pass over
  # the whole namespace — see influx-backup.sh.
  name: influx-backup
  namespace: health
spec:
  schedule: "30 2 * * *"          # before the 03:00 restic sweep
  timeZone: "UTC"                 # without this the schedule is read in kube-controller-manager's local zone
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600   # a missed window is retried for an hour, then skipped (not silently lost forever)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600 # with concurrencyPolicy: Forbid, a hung run would otherwise
                                  # block every subsequent night with nothing alerting
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: health-backup
          containers:
            - name: backup
              # bitnami/kubectl no longer publishes plain version tags (Bitnami moved
              # unauthenticated floating tags to bitnamilegacy/*, frozen since 2025-08-22,
              # capped at 1.33.4 — confirmed via registry API: bitnami/kubectl:1.33 and
              # :1.36 both 404). bitnamilegacy/kubectl:1.33 exists but has neither wget
              # nor curl (verified in-cluster), which the hc-ping step below needs.
              # rancher/kubectl:v1.36.0 exists and matches the server minor but ships no
              # shell at all. alpine/k8s:1.36.0 matches the cluster's server version
              # (v1.36.0) exactly and was verified in-cluster to have kubectl v1.36.0,
              # sh, wget, curl, awk, xargs, date — everything this script needs.
              image: alpine/k8s:1.36.0
              # The script is homelab/health/scripts/influx-backup.sh, mounted at
              # /scripts by the configMapGenerator in this directory's
              # kustomization.yaml. It exec-s two further scripts into the influxdb
              # pod as TEXT (`sh -c "$(cat ...)"`) rather than mounting this
              # ConfigMap there: mounting it into influxdb.yaml would couple that
              # Deployment to the backup ConfigMap and roll influxdb on every script
              # edit.
              command: ["sh", "/scripts/influx-backup.sh"]
              env:
                # uptime-kuma push monitor `health-influx-backup`
                # (token at op://Homelab/health-healthchecks/backup-kuma-push-token).
                # Substituted by envsubst at apply time; never committed.
                #
                # RENAMED AT THIS BOUNDARY. Only PUSH_URL reaches the script: a
                # generated script rides the same envsubst stream as this
                # manifest and envsubst rewrites the bare `$NAME` form too, so
                # naming the allowlisted variable there would publish the token
                # inside a ConfigMap. `make check-script-substitution` enforces
                # it. The whole URL is assembled here, so the script never has
                # to build one from a value it was handed.
                - name: PUSH_URL
                  value: "https://uptime.cynexia.com/api/push/${HEALTH_KUMA_BACKUP_TOKEN}"
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
                - { name: scripts, mountPath: /scripts, readOnly: true }
                # Grafana's SQLite database, for the logical dump the driver
                # takes with grafana-sqlite-backup.py.
                #
                # READ-ONLY, AT BOTH LEVELS. A backup must not be able to write
                # the data it is backing up, and SQLite's online backup API only
                # ever reads the source. This works because Grafana's default is
                # `wal = false` (conf/defaults.ini): a rollback-journal database
                # opens read-only without needing to create a `-shm`. Turning
                # WAL on (`GF_DATABASE_WAL=true`) breaks the dump loudly at open
                # time and this mount would have to become read-write — change
                # the two together or the backup stops.
                #
                # Mounting a ReadWriteOnce PVC into a second pod is legal
                # because RWO is a per-NODE constraint, and local-path pins both
                # this pod and grafana to the node holding the volume. Their
                # co-location is guaranteed by topology, not by a scheduling
                # rule: this is a single-node cluster, so both PVs live on the
                # same node. If a second node is ever added and the two PVs land
                # apart, this pod's volume affinities have no intersection — it
                # sits Pending, no dump is produced, and the restic gate's 30 h
                # freshness check goes red. Loud, not silent; add explicit
                # co-location only if that day comes.
                - { name: grafana-data, mountPath: /grafana, readOnly: true }
          initContainers:
            - name: mkdirs
              image: busybox:1.37
              command: [sh, -c, "mkdir -p /dumps/native /dumps/lp /dumps/grafana"]
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
          volumes:
            - name: dumps
              persistentVolumeClaim: { claimName: health-dumps }
            - name: scripts
              configMap: { name: health-backup-scripts }
            - name: grafana-data
              persistentVolumeClaim: { claimName: grafana-data, readOnly: true }
