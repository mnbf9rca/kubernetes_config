apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-freshness
  namespace: health
spec:
  schedule: "15 */6 * * *"
  timeZone: "UTC"                 # without this the schedule is read in kube-controller-manager's local zone
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Bounds a hung curl. Worst case per run: 2 freshness queries at -m 30, 2
      # last-point queries at -m 10, and at most ONE push at -m 15 (there is a
      # single monitor now, and a run that pushes at all pushes once) = ~95s.
      # 300 leaves headroom without letting a wedged run block the next window.
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.14.1
              # The script is homelab/health/scripts/ingest-freshness.sh, mounted
              # at /scripts by the configMapGenerator in this directory's
              # kustomization.yaml.
              command: ["sh", "/scripts/ingest-freshness.sh"]
              env:
                - name: TOKEN
                  valueFrom: { secretKeyRef: { name: health-influxdb, key: read-token } }
                # ONE push monitor, `health-ingest`, for both buckets — one
                # CronJob checks apple and garmin in a single process, so two
                # monitors would be one signal counted twice. Token at
                # op://Homelab/health-healthchecks/ingest-kuma-push-token.
                #
                # RENAMED AT THIS BOUNDARY. Only PUSH_URL reaches the script,
                # because a generated script rides the same envsubst stream as
                # this manifest and envsubst rewrites the bare `$NAME` form too.
                # `make check-script-substitution` enforces it.
                - name: PUSH_URL
                  value: "https://uptime.cynexia.com/api/push/${HEALTH_KUMA_INGEST_TOKEN}"
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: scripts
              configMap: { name: health-backup-scripts }
