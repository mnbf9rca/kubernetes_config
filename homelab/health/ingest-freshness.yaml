apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-freshness
  namespace: health
spec:
  schedule: "15 */6 * * *"
  timeZone: "UTC"                 # without this the schedule is read in kube-controller-manager's local zone
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300  # bounds a hung curl; this job is two queries and two pings
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.14.1
              # The script is homelab/health/scripts/ingest-freshness.sh, mounted
              # at /scripts by the configMapGenerator in this directory's
              # kustomization.yaml.
              command: ["sh", "/scripts/ingest-freshness.sh"]
              env:
                - name: TOKEN
                  valueFrom: { secretKeyRef: { name: health-influxdb, key: read-token } }
                - { name: HC_APPLE, value: "${HEALTH_HC_APPLE_UUID}" }
                - { name: HC_GARMIN, value: "${HEALTH_HC_GARMIN_UUID}" }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: scripts
              configMap: { name: health-backup-scripts }
