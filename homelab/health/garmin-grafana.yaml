---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: garmin-tokens, namespace: health }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 100Mi } }
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-grafana
  namespace: health
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  # Requires the garmin-tokens PVC to hold a valid token cache, written by the
  # one-off interactive login pod in garmin-login-pod.yaml (not in the
  # kustomization). Tokens last about a year; runbook: docs/operations/homelab-health.md.
  #
  # No GARMINCONNECT_EMAIL / GARMINCONNECT_BASE64_PASSWORD here, deliberately.
  # The script falls back to a credential login on ANY token-login error,
  # transient ones included, and with credentials present that fallback logs in,
  # makes Garmin send the operator an MFA SMS, then dies at the code prompt
  # because there is no TTY. Ten restarts and ten SMS codes in 17 days, 2026-09-29.
  # Without credentials the fallback fails at the e-mail prompt instead, before
  # it reaches Garmin, and the restart retries the still-valid token.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: garmin-grafana } }
  template:
    metadata:
      labels: { app: garmin-grafana }
    spec:
      securityContext: { fsGroup: 1000 }   # image runs as appuser 1000:1000
      containers:
        - name: garmin-fetch
          image: thisisarpanghosh/garmin-fetch-data:latest
          imagePullPolicy: Always
          env:
            - { name: INFLUXDB_VERSION, value: "1" }
            - { name: INFLUXDB_HOST, value: influxdb.health.svc.cluster.local }
            - { name: INFLUXDB_PORT, value: "8086" }
            - { name: INFLUXDB_USERNAME, value: garmin }
            - name: INFLUXDB_PASSWORD
              valueFrom: { secretKeyRef: { name: health-influxdb, key: garmin-v1-password } }
            - { name: INFLUXDB_DATABASE, value: GarminStats }
            - { name: USER_TIMEZONE, value: Europe/London }
            - { name: UPDATE_INTERVAL_SECONDS, value: "900" }
            - { name: TAG_MEASUREMENTS_WITH_USER_EMAIL, value: "True" }
          volumeMounts:
            - { name: tokens, mountPath: /home/appuser/.garminconnect }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tokens
          persistentVolumeClaim: { claimName: garmin-tokens }
