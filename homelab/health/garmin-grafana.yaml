---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: garmin-tokens, namespace: health }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 100Mi } }
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-grafana
  namespace: health
spec:
  # Requires the garmin-tokens PVC to hold a valid token cache (one-time
  # interactive 2FA login, plan Task 11 Step 3 — done 2026-07-26, ~annual).
  # If auth expires, scale to 0 FIRST, redo the login pod, then back to 1 —
  # a crashlooping pod fires an MFA SMS at the operator on every restart.
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: garmin-grafana } }
  template:
    metadata:
      labels: { app: garmin-grafana }
    spec:
      securityContext: { fsGroup: 1000 }   # image runs as appuser 1000:1000
      containers:
        - name: garmin-fetch
          # Digest-pinned main-branch build (2026-05-19): v0.5.0 crashes on
          # TAG_MEASUREMENTS_WITH_USER_EMAIL (client.profile AttributeError);
          # fixed upstream post-release (display_name). Move to the next
          # tagged release when Renovate proposes it.
          image: thisisarpanghosh/garmin-fetch-data@sha256:8b7955d3459a42c4cbc2cb7a1b201daed1f77ac959e9063c55b055ad12aecdf2
          env:
            - { name: INFLUXDB_VERSION, value: "1" }
            - { name: INFLUXDB_HOST, value: influxdb.health.svc.cluster.local }
            - { name: INFLUXDB_PORT, value: "8086" }
            - { name: INFLUXDB_USERNAME, value: garmin }
            - name: INFLUXDB_PASSWORD
              valueFrom: { secretKeyRef: { name: health-influxdb, key: garmin-v1-password } }
            - { name: INFLUXDB_DATABASE, value: GarminStats }
            - name: GARMINCONNECT_EMAIL
              valueFrom: { secretKeyRef: { name: health-garmin, key: email } }
            - name: GARMINCONNECT_BASE64_PASSWORD
              valueFrom: { secretKeyRef: { name: health-garmin, key: b64-password } }
            - { name: USER_TIMEZONE, value: Europe/London }
            - { name: UPDATE_INTERVAL_SECONDS, value: "900" }
            - { name: TAG_MEASUREMENTS_WITH_USER_EMAIL, value: "True" }
          volumeMounts:
            - { name: tokens, mountPath: /home/appuser/.garminconnect }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: tokens
          persistentVolumeClaim: { claimName: garmin-tokens }
