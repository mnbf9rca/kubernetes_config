---
apiVersion: v1
kind: ConfigMap
metadata:
  name: health-cloudflared-config
  namespace: health
data:
  config.yaml: |
    tunnel: cynexia-health
    credentials-file: /etc/cloudflared/creds/credentials.json
    no-autoupdate: true
    metrics: 0.0.0.0:2000
    ingress:
      # SECURITY: every hostname below that fronts an AUTHLESS origin must have a
      # matching Cloudflare Access app — the auth gate is account-side state this
      # repo cannot express or verify. Adding an ingress line here (plus
      # `make route-health-dns`, which mints a CNAME for every hostname in this
      # ConfigMap) publishes the origin to the internet with whatever auth the
      # Access dashboard happens to have. See influxdb-mcp.yaml's header.
      - hostname: hae.cynexia.com
        service: http://apple-health-ingester.health.svc.cluster.local:8080
      - hostname: mcp.cynexia.com
        service: http://influxdb-mcp.health.svc.cluster.local:3000
      # Off-cluster origin: the Hermes agent dashboard on the hermes VM
      # (10.100.0.20). Access app "hermes" (karakeep's reusable policies)
      # gates it at the edge; the dashboard's own login is the second gate.
      - hostname: hermes.cynexia.com
        service: http://hermes.cynexia.net:9119
      # Off-cluster origin: hermes-webui on the same VM, the server the Hermex
      # iOS app talks to (github.com/uzairansaruzi/hermex). Access app
      # "hermes-app" gates it at the edge, with a Service Auth policy so the
      # app's token is verified and logged rather than waved through.
      # That gate is doing more work than it looks: hermes-webui serves
      # /share/*, /api/share/* and /static/* with NO authentication of its own
      # (api/auth.py PUBLIC_PATHS + the prefix matches in check_auth), so
      # "the WebUI password is the second gate" is true of the app but NOT of
      # every path. Must serve at the root on 443 — the app appends no path
      # or port.
      - hostname: hermes-app.cynexia.com
        service: http://hermes.cynexia.net:8787
      # Egress proxy for changedetection on the VPS: a TCP origin, not HTTP,
      # and the only one in this block. THE ORIGIN IS AUTHLESS - tinyproxy
      # serves any client the tunnel hands it - so the Cloudflare Access
      # application "homelab-proxy", holding one Service Auth policy with one
      # service token and nothing else, is the only thing between this
      # hostname and an open HTTP proxy running on the operator's home
      # connection. It fails open, like every app named in this block.
      - hostname: proxy.cynexia.com
        service: tcp://tinyproxy.proxy.svc.cluster.local:8888
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: health
  # NO keel annotations — pinned image, Renovate proposes updates.
spec:
  replicas: 1
  selector: { matchLabels: { app: health-cloudflared } }
  template:
    metadata:
      labels: { app: health-cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38   # pin: latest stable as of 2026-07-26; Renovate proposes updates
          args: [tunnel, --config, /etc/cloudflared/config.yaml, run]
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared/config.yaml, subPath: config.yaml }
            - { name: creds, mountPath: /etc/cloudflared/creds, readOnly: true }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6     # laxer than readiness below, so the pod goes unready before it is killed
          # /ready reports the tunnel's connector count: 0 registered connections = 503.
          # Without a readiness probe the pod counts as Ready the instant the process starts,
          # before any edge connection exists.
          readinessProbe:
            httpGet: { path: /ready, port: 2000 }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: health-cloudflared-config }
        - name: creds
          secret: { secretName: health-cloudflared-credentials }
