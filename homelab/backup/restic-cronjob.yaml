apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: backup
spec:
  schedule: "0 3 * * *"
  # Without timeZone the schedule is interpreted in kube-controller-manager's
  # local zone, which is not something this repo controls.
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  # Tolerate up to an hour of controller/node downtime before a missed run is
  # written off entirely.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Hard ceiling on a hung B2 connection. Without this, concurrencyPolicy
      # Forbid silently skips every subsequent night. 4h is an opening guess —
      # resize it from the durations healthchecks.io records.
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      # 3 days, so a Friday-night failure is still forensically available on
      # Monday morning.
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          restartPolicy: Never
          # No terminationGracePeriodSeconds override. A longer grace period is
          # only useful if the process can act on SIGTERM, and this one cannot:
          # busybox ash runs as PID 1 and neither forwards TERM to the running
          # restic child nor acts on it while a foreground child is running
          # (verified in restic/restic:0.17.3 - a TERM trap in the child never
          # fired). `exec`ing restic to make it PID 1 is not available either:
          # the wrapper has to outlive it to send the exit-code ping. So a grace
          # period would just burn its full length before the inevitable SIGKILL
          # on every deadline hit, node drain and `kubectl delete`, and the lock
          # would still be left behind. What actually recovers the lock is the
          # `restic unlock` at the head of the next run (below).
          containers:
            - name: restic
              image: restic/restic:0.17.3
              command: ["sh", "-c"]
              args:
                - |
                  # shellcheck disable=SC3040  # `set -o pipefail` is not POSIX but is supported by
                  # the busybox ash in restic/restic:0.17.3 (verified: BusyBox v1.36.1, Alpine 3.20).
                  set -uo pipefail

                  # Dead-man's-switch. /start detects started-but-never-finished
                  # and records the run duration; the exit-code ping distinguishes
                  # success from failure. Pings never fail the job.
                  #
                  # EACH PING CARRIES A BODY - a short key=value summary of what this run
                  # observed, so the healthchecks.io Events log answers "what did it see?"
                  # without a pod log that may already have aged out. Four properties are
                  # load-bearing:
                  #
                  #   1. A PING MUST NEVER FAIL THE JOB, AND A BODY MUST NEVER COST A PING.
                  #      A failed body POST falls back to a bodiless ping on the SAME file -
                  #      no intermediate copy, because `head -c src > cpy` truncates cpy
                  #      BEFORE head runs, so any head failure leaves an empty file and
                  #      --post-file=<empty> is a SUCCESSFUL post of a blank body that never
                  #      falls back.
                  #   2. NEVER EMIT A COMMAND'S OUTPUT. A script cannot classify its own
                  #      command output at runtime, and this body goes to a third party who
                  #      keeps it until the ping log rotates. The concrete leaks: the
                  #      scripts influx-backup.sh execs pass the InfluxDB operator token on
                  #      argv, and a failing wget quotes the ping URL, which IS the check's
                  #      write credential. (A restic repository URI is NOT a reason - it
                  #      grants nothing; see the tiers in AGENTS.md.)
                  #      `make check-ping-bodies` enforces it; read spec section 9.2 before
                  #      adding a field.
                  #   3. A BARE TRAILING SLASH IS AN HTTP 400 (verified live against
                  #      hc-ping.com), so the URL is built conditionally.
                  #   4. `true >`, NOT `: >`. `:` is a POSIX special built-in and a
                  #      redirection error on one aborts a non-interactive shell even behind
                  #      `|| true` (verified in dash).
                  #
                  # hc_ping resets the body after every ping, so the exit body can never
                  # open with "summary=starting". That is a construction, not a discipline.
                  HC_BODY=/tmp/hc-body
                  # The stderr redirection PRECEDES the body redirection in both. Redirections
                  # are applied left to right, so `>> "$HC_BODY" 2>/dev/null` cannot suppress the
                  # shell's own "cannot create" diagnostic - only this order can (verified in dash
                  # and busybox 1.36.1). Property 4 above is what keeps the job alive on that day;
                  # this is what keeps its log readable.
                  hc_reset() { true 2>/dev/null > "$HC_BODY" || true; }
                  emit() { { printf '%s' "$*" | LC_ALL=C tr -cd '\040-\176'; printf '\n'; } 2>/dev/null >> "$HC_BODY" || true; }

                  HC="https://hc-ping.com/${HC_UUID}"
                  # ping_hc [SUFFIX] - "" | start | <exit-status>.
                  ping_hc() {
                    _sf=${1:-}
                    _u=$HC
                    [ -z "$_sf" ] || _u="$HC/$_sf"
                    if [ -s "$HC_BODY" ]; then
                      if wget -q -T 10 -O- --post-file="$HC_BODY" "$_u" >/dev/null 2>&1; then
                        hc_reset; return 0
                      fi
                      echo "hc: body POST failed, retrying without a body" >&2
                    fi
                    # Fixed text. No URL, no tool output: for a ping the URL IS the write
                    # credential, and a pod log is not a place to put one either.
                    wget -q -T 10 -O- "$_u" >/dev/null 2>&1 || echo "hc: ping not delivered" >&2
                    hc_reset
                    return 0
                  }

                  # ONE SINK PER DIAGNOSTIC. Every ERROR: line below goes to the pod log AND
                  # into the ping body from a single call, so the first reword cannot
                  # desynchronise the log from the third-party body. Do not write
                  # `echo "ERROR: x"; emit "error=x"` at fifteen sites.
                  #
                  # Lines are held in a variable rather than a second file because spec
                  # section 5 makes `summary=` line 1, and the errors are known before the
                  # summary is; they are flushed after it.
                  HC_ERR_LINES=""
                  say_err() {
                    echo "ERROR: $*"
                    # COLLAPSE NEWLINES AT CAPTURE. flush_errors splits this accumulator on
                    # newlines to make one body record per diagnostic, and it does that BEFORE
                    # `emit` sanitises - so a newline inside a value (a PVC directory name can
                    # carry one) splits into extra records and can synthesise a key nobody
                    # emitted: a second `prune=` after, and contradicting, the real one. Killing
                    # it here is what makes spec section 5's one-record-per-emit invariant true
                    # for this path too, and not only for direct `emit` calls.
                    _sm=$(printf '%s' "$*" | tr '\n\r' '  ')
                    HC_ERR_LINES="$HC_ERR_LINES
                  error=$_sm"
                  }
                  flush_errors() {
                    [ -n "$HC_ERR_LINES" ] || return 0
                    printf '%s\n' "$HC_ERR_LINES" | while read -r _fl; do
                      # check-ping-bodies: untaint _fl - every line here was produced by say_err, whose argument the same check validated at its call site
                      [ -z "$_fl" ] || emit "$_fl"
                    done
                  }

                  # STEP names the phase for failed_step= in the ping body. `step NAME [TEXT]`
                  # echoes TEXT (or NAME) exactly as the plain echoes it replaces did, so the
                  # pod log is byte-identical. The last step is `finished`, not `done`,
                  # because `done` is a shell keyword and shellcheck rejects it unquoted in a
                  # test.
                  STEP=start
                  step() { STEP=$1; echo "==> ${2:-$1}"; }

                  # ---- Backup verification gate ---------------------------------------
                  # WHAT THIS EXISTS TO STOP
                  # `hostPath: type: Directory` asserts only that the directory EXISTS. If the
                  # SSD user volume (/var/mnt/ssd, /dev/sdb1) fails to mount while its
                  # mountpoint survives on the EPHEMERAL partition (/dev/sda6), /data is a bare
                  # empty directory. restic then backs up an EMPTY TREE, `restic check` passes,
                  # the job exits 0 and healthchecks.io goes green - restic succeeds on an empty
                  # tree and pings 0. `forget --prune --keep-daily 7` then expires all seven
                  # genuine daily recovery points over the following week, leaving nothing but
                  # snapshots of nothing. This is not hypothetical: snapshot 551bd209 in this
                  # repository is 12 B and is currently retained as a "monthly" snapshot.
                  #
                  # HOMELAB DIFFERS FROM VPS. The VPS gate verifies `*.restic` quiesce snapshots
                  # written by sqlite/pg sidecars. Homelab has no quiesce sidecars: every
                  # local-path PVC is backed up as live application state. So the assertions
                  # here are about the TREE, not about snapshot files:
                  #
                  #   1. MOUNT IDENTITY (check_mount)  - AUTHORITATIVE. Direct, first-order.
                  #   2. TREE SCALE     (check_scale)  - AUTHORITATIVE. Empty/implausibly small.
                  #   3. EXPECTED SET   (check_expected) - AUTHORITATIVE. Per-application artifacts.
                  #   4. DUMP FRESHNESS (check_fresh)  - AUTHORITATIVE. The influx dumps, the
                  #                                      Grafana SQLite dump and the hermes zip
                  #                                      are the artifacts produced on a schedule,
                  #                                      so age is meaningful for them and for
                  #                                      nothing else here.
                  #   5. PER-PVC TABLE  (measure_tree) - the size table is forensic; an empty PVC
                  #                                      directory only WARNS (a freshly
                  #                                      provisioned PVC is legitimately empty),
                  #                                      but an UNREADABLE one FAILS: "I could not
                  #                                      look" must never be reported as "fine".
                  #
                  # MAINTENANCE CONTRACT: a new local-path PVC that holds anything you would miss
                  # must be added to EXPECTED_ARTIFACTS. Forget, and that application's backup is
                  # unverified - silently. An explicit list somebody has to maintain beats a
                  # wildcard that silently accepts nothing at all.
                  #
                  # This file is the source of truth for the thresholds and both artifact lists
                  # below. docs/operations/monitoring.md ("The homelab backup verification gate")
                  # reproduces them with the reasoning behind each one; change them here and
                  # there in the same commit, or that section quietly becomes fiction.
                  #
                  # Paths must be globs: local-path-provisioner names each PVC directory
                  # <pvName>_<namespace>_<pvcName> and pvName is a random UUID. The StorageClass
                  # is reclaimPolicy: Retain, so deleting and recreating a PVC leaves the old
                  # directory behind forever; each glob therefore resolves to its MOST RECENTLY
                  # MODIFIED match, so a live artifact always beats its frozen predecessor.
                  #
                  # The residual, stated plainly: if the live artifact is absent ENTIRELY - a PVC
                  # recreated and not yet written to - the orphan is the only match and the check
                  # passes on it. Telling bound from orphaned needs the Kubernetes API from inside
                  # this job, i.e. a ServiceAccount and RBAC on a backup CronJob, which is not
                  # worth it here: the orphan lives under /data and is backed up too, so this is a
                  # gate reporting on the wrong file, not a lost recovery point. What it gets
                  # instead is visibility - every resolved path is printed, so an orphan
                  # substitution shows up in the job log rather than hiding behind "8/8".

                  # The influx dumps are written nightly at 02:30 by the health/influx-backup
                  # CronJob, 30 minutes before this job. 30h tolerates one missed or delayed run
                  # (health/influx-backup has its own uptime-kuma monitor for that) and fails on
                  # two consecutive misses or on the dumps disappearing entirely.
                  STALE_MINUTES=1800
                  STALE_SECONDS=$(( STALE_MINUTES * 60 ))

                  # Floors, not targets. Measured 2026-08-20: 10 PVC directories, 44,288 files,
                  # 4.418 GiB (~4,633,000 KiB). Set with ~4x headroom so ordinary shrinkage
                  # (log rotation, emby cache eviction) never trips them, while an empty or
                  # single-PVC tree cannot possibly clear them.
                  MIN_PVC_DIRS=8
                  MIN_DATA_KIB=1048576

                  # ---- disk-usage thresholds ------------------------------------------
                  # local-path enforces NO QUOTA: a PVC's `storage:` figure is a request and
                  # nothing more, so "a PVC filled up" always means "the shared node SSD filled
                  # up", taking every workload on it with it. Until this landed, nothing in the
                  # estate watched that - the claim that node-level monitoring covered it was
                  # simply untrue.
                  #
                  # WARN, THEN FAIL. 80% prints a loud advisory and leaves the job green,
                  # because a backup that runs is worth more than an alert about headroom; 90%
                  # fails the gate, which also defers `forget --prune` - correct, since pruning
                  # is the wrong thing to be doing while the node is about to wedge. The
                  # `disk_pct=` field in the ping body carries the number every night either way,
                  # so the trend is visible before either threshold is crossed.
                  #
                  # THE RESIDUAL, STATED: this samples once a night. A fill faster than a day
                  # still lands between runs. Bounded in practice by what actually grows here -
                  # the 7-dump prunes and postgres's small working set.
                  DISK_WARN_PCT=80
                  DISK_FAIL_PCT=90

                  # label:glob:min-bytes. Minimums are an order of magnitude below the observed
                  # sizes: they exist to reject a zero-length or truncated file, not to track
                  # growth. NO COMMENTS INSIDE EITHER LIST BELOW - both are split on whitespace,
                  # so a `#` line would be parsed as an entry.
                  #
                  # `grafana-dump` was measured on 2026-08-24 (seed run: 2,039,808 bytes,
                  # 273 schema objects); 204800 sits roughly an order of magnitude below
                  # that, per the same convention as the rows above. MIN_BYTES in
                  # homelab/health/scripts/grafana-sqlite-backup.py carries the same floor -
                  # raise the two together.
                  #
                  # `hindsight-dump` was measured at rollout step 5 (2026-08-24): the first
                  # real dump was 48,829 B / 23 tables, so 4096 sits an order of magnitude
                  # below it, same derivation as the rows above. MIN_BYTES in
                  # homelab/hindsight/scripts/hindsight-pg-dump.sh carries the same floor -
                  # raise the two together.
                  # It appears in BOTH lists deliberately: the dump is produced on a schedule, so
                  # a stale one is as bad as a missing one, and only FRESH_ARTIFACTS notices that.
                  EXPECTED_ARTIFACTS="
                  emby-library:/data/pvc-*_downloads_emby-config/data/library.db:1048576
                  hydra2-config:/data/pvc-*_downloads_hydra2-config/nzbhydra.yml:4096
                  radarr-db:/data/pvc-*_downloads_radarr-config/radarr.db:1048576
                  sabnzbd-ini:/data/pvc-*_downloads_sabnzbd-config/sabnzbd.ini:1024
                  sonarr-db:/data/pvc-*_downloads_sonarr-config/sonarr.db:1048576
                  grafana-db:/data/pvc-*_health_grafana-data/grafana.db:262144
                  grafana-dump:/data/pvc-*_health_health-dumps/grafana/*-grafana.db:204800
                  influxdb-bolt:/data/pvc-*_health_influxdb-data/influxd.bolt:32768
                  garmin-tokens:/data/pvc-*_health_garmin-tokens/garmin_tokens.json:256
                  hermes-zip:/data/pvc-*_backup_hermes-dumps/hermes-*.zip:16777216
                  hindsight-dump:/data/pvc-*_hindsight_hindsight-dumps/hindsight-*.sql.gz:4096
                  "

                  # label:glob - existence AND freshness.
                  FRESH_ARTIFACTS="
                  influx-native-dump:/data/pvc-*_health_health-dumps/native/*
                  influx-lp-export:/data/pvc-*_health_health-dumps/lp/*.lp.gz
                  grafana-dump:/data/pvc-*_health_health-dumps/grafana/*-grafana.db
                  hermes-zip:/data/pvc-*_backup_hermes-dumps/hermes-*.zip
                  hindsight-dump:/data/pvc-*_hindsight_hindsight-dumps/hindsight-*.sql.gz
                  "

                  # Populated by measure_tree; initialised here so `set -u` cannot bite if
                  # measure_tree ever returns before assigning.
                  TREE_DIRS=0
                  TREE_KIB=0
                  NOW=0
                  # Body fields. Initialised here so `set -u` cannot bite in the
                  # ping-body block if the run aborts before a gate function ran.
                  MOUNT_OK=unknown
                  ART_OK=0
                  ART_TOT=0
                  FRESH_OK=0
                  FRESH_TOT=0
                  PRUNE=skipped
                  RESTIC_CHECK=not-reached
                  TREE_GIB=unknown
                  DISK_PCT=unknown

                  # Resolve a glob to its most recently modified existing match.
                  # stdout: the path. 0 = found, 1 = nothing matched, 2 = a match existed but
                  # could not be stat'd (never reported as present).
                  #
                  # 2 is returned on the FIRST unreadable candidate, not only once every
                  # candidate has proved unreadable - deliberately fail-closed. reclaimPolicy:
                  # Retain leaves orphaned PVC directories behind forever, so "skip what you
                  # cannot read and take the newest of the rest" would silently validate a
                  # stale orphan on exactly the night the live artifact became unreadable. A
                  # red over a file that vanished mid-walk costs one skipped prune; the
                  # alternative costs a green ping over data nobody could read.
                  newest_match() {
                    set +f
                    # shellcheck disable=SC2086  # deliberate: $1 IS a glob pattern and must be
                    # word-split and path-expanded here; quoting it defeats the whole function.
                    set -- $1
                    set -f
                    _best=""; _best_m=-1
                    for _c in "$@"; do
                      [ -e "$_c" ] || continue
                      _m=$(stat -c %Y "$_c" 2>/dev/null) || return 2
                      if [ "$_m" -gt "$_best_m" ]; then _best_m=$_m; _best=$_c; fi
                    done
                    [ -n "$_best" ] || return 1
                    printf '%s\n' "$_best"
                  }

                  # Age assertion on one resolved path. $1 = path, $2 = label.
                  assert_fresh() {
                    _am=$(stat -c %Y "$1" 2>&1) || {
                      # check-ping-bodies: untaint _am - stat's own message, not emitted: say_err names the label and path only
                      say_err "$2: cannot stat $1"
                      echo "       stat said: $_am"
                      return 1
                    }
                    case "$_am" in
                      ''|*[!0-9]*) say_err "$2: unparseable mtime for $1"
                                   echo "       stat printed: $_am"; return 1 ;;
                    esac
                    _aage=$(( NOW - _am ))
                    [ "$_aage" -lt "$STALE_SECONDS" ] && return 0
                    say_err "$2 STALE: $1 is $(( _aage / 3600 ))h old (limit $(( STALE_SECONDS / 3600 ))h)"
                    return 1
                  }

                  # Size assertion on one resolved path. $1 = path, $2 = label, $3 = min bytes.
                  assert_min_size() {
                    _zs=$(stat -c %s "$1" 2>&1) || {
                      # check-ping-bodies: untaint _zs - gated to digits by the case below before it is ever emitted
                      say_err "$2: cannot stat $1"
                      echo "       stat said: $_zs"
                      return 1
                    }
                    case "$_zs" in
                      ''|*[!0-9]*) say_err "$2: unparseable size for $1"
                                   echo "       stat printed: $_zs"; return 1 ;;
                    esac
                    [ "$_zs" -ge "$3" ] && return 0
                    say_err "$2 IMPLAUSIBLY SMALL: $1 is ${_zs} B (floor ${3} B)"
                    return 1
                  }

                  # ---- 1. MOUNT IDENTITY ----------------------------------------------
                  # The only check here that observes the mount directly rather than inferring it
                  # from content. Talos puts the kubelet pod directory on the EPHEMERAL partition
                  # (/dev/sda6) - the SAME filesystem that /var/mnt/ssd/local-path-provisioner
                  # falls back to when the SSD user volume fails to mount. /etc/hosts is
                  # bind-mounted from that pod directory into every non-hostNetwork container, so
                  # its st_dev IS the EPHEMERAL device, readable from inside this container with
                  # no host access at all.
                  #
                  # Healthy:   /data st_dev = SSD (/dev/sdb1), /etc/hosts st_dev = EPHEMERAL -> DIFFER.
                  # Unmounted: /data is a bare directory on EPHEMERAL                        -> MATCH -> fail.
                  # Verified in-cluster 2026-08-20: st_dev 2065 (8:17 /dev/sdb1) vs 2054 (8:6 /dev/sda6).
                  check_mount() {
                    _md=$(stat -c %d /data 2>&1) || {
                      MOUNT_OK=no
                      say_err "mount check: cannot stat /data"
                      # stat's own message belongs in the POD LOG and nowhere else: it is the
                      # difference between ENOENT, EACCES and a wedged NFS mount, and it is not
                      # something a third party gets to keep. Not a sink - a plain log line.
                      echo "       stat said: $_md"
                      return 1
                    }
                    _mh=$(stat -c %d /etc/hosts 2>&1) || {
                      MOUNT_OK=no
                      say_err "mount check: cannot stat /etc/hosts"
                      echo "       stat said: $_mh"
                      echo "       Without it the SSD mount cannot be distinguished from its"
                      echo "       fallback, so this is a failure, not a pass."
                      return 1
                    }
                    # `2>&1` above means these hold stat's ERROR TEXT on the failure arms, so gate
                    # both to digits before either can reach a sink - every other captured value in
                    # this script is gated the same way, and this one was the exception.
                    case "$_md$_mh" in
                      ''|*[!0-9]*)
                        MOUNT_OK=no
                        say_err "mount check: unparseable st_dev for /data or /etc/hosts"
                        return 1 ;;
                    esac
                    if [ "$_md" = "$_mh" ]; then
                      MOUNT_OK=no
                      # check-ping-bodies: untaint _md - gated to digits by the case above
                      say_err "/data shares a filesystem with the kubelet pod directory (st_dev $_md)."
                      echo "       The SSD user volume is NOT mounted - /data is the bare mountpoint"
                      echo "       on the EPHEMERAL partition. Anything backed up now is not the data."
                      return 1
                    fi
                    MOUNT_OK=yes
                    echo "note: mount ok - /data st_dev=$_md, kubelet pod dir st_dev=$_mh"
                    return 0
                  }

                  # ---- 5. PER-PVC TABLE (and the numbers check_scale uses) -------------
                  # Walks each local-path PVC directory once. Prints a size table (forensics: the
                  # night a PVC empties, the diff is in the log), and accumulates the directory
                  # count and total size that check_scale asserts on.
                  #
                  # du's EXIT STATUS is advisory, its OUTPUT is not. busybox du returns non-zero
                  # when a file vanishes mid-walk, which happens routinely here (sqlite WAL files,
                  # rotating logs) and must not manufacture a nightly red. But an unparseable
                  # total IS fatal, and so is a directory that cannot be opened at all - that is
                  # checked explicitly with -r/-x, which does not race.
                  #
                  # du's STDERR is therefore deliberately NOT captured. It goes to the pod log,
                  # where it belongs. Folding it in with 2>&1 puts "du: can't open ...: Permission
                  # denied" ahead of the total in the same string, ${_mdu%%[!0-9]*} yields the
                  # empty prefix, and the advisory walk error is promoted to the fatal
                  # "unparseable total" branch - defeating this whole paragraph. Verified in
                  # restic/restic:0.17.3.
                  dir_is_empty() {
                    _ed=$1
                    set +f
                    set -- "$_ed"/* "$_ed"/.[!.]* "$_ed"/..?*
                    set -f
                    for _ec in "$@"; do
                      if [ -e "$_ec" ] || [ -L "$_ec" ]; then return 1; fi
                    done
                    return 0
                  }

                  measure_tree() {
                    TREE_DIRS=0
                    TREE_KIB=0
                    _mrc=0
                    set +f
                    set -- /data/pvc-*_*_*
                    set -f
                    for _mdir in "$@"; do
                      [ -d "$_mdir" ] || continue
                      if [ ! -r "$_mdir" ] || [ ! -x "$_mdir" ]; then
                        say_err "PVC directory is not readable: $_mdir"
                        _mrc=1
                        continue
                      fi
                      _mdu=$(du -sk "$_mdir") || echo "WARNING (advisory) du reported errors under $_mdir"
                      _mk=${_mdu%%[!0-9]*}
                      case "$_mk" in
                        ''|*[!0-9]*)
                          say_err "unparseable 'du -sk' output for $_mdir"
                          echo "       du printed: $_mdu"
                          _mrc=1
                          continue
                          ;;
                      esac
                      TREE_DIRS=$(( TREE_DIRS + 1 ))
                      TREE_KIB=$(( TREE_KIB + _mk ))
                      if dir_is_empty "$_mdir"; then
                        echo "WARNING (advisory, does not fail the job) PVC directory is EMPTY: $_mdir"
                      else
                        echo "note: ${_mk} KiB  $_mdir"
                      fi
                    done
                    set +f
                    return $_mrc
                  }

                  # ---- 2. TREE SCALE ---------------------------------------------------
                  check_scale() {
                    _crc=0
                    if [ "$TREE_DIRS" -lt "$MIN_PVC_DIRS" ]; then
                      say_err "only $TREE_DIRS local-path PVC directories under /data (floor $MIN_PVC_DIRS)"
                      echo "       An unmounted SSD user volume presents as zero."
                      _crc=1
                    fi
                    if [ "$TREE_KIB" -lt "$MIN_DATA_KIB" ]; then
                      say_err "/data totals ${TREE_KIB} KiB, below the ${MIN_DATA_KIB} KiB floor."
                      echo "       This tree is empty or implausibly small - do not trust this backup."
                      _crc=1
                    fi
                    [ "$_crc" -eq 0 ] && echo "note: scale ok - $TREE_DIRS PVC directories, ${TREE_KIB} KiB total"
                    return $_crc
                  }

                  # ---- 2b. DISK USAGE --------------------------------------------------
                  # `df -Pk /data` in POSIX mode, so the columns cannot be reflowed by a long
                  # device name (the classic df parsing trap, and the reason -P exists). Field 5
                  # of the last line is the use percentage, with a trailing `%` stripped here.
                  #
                  # Nothing captured reaches the ping body ungated: df's output is parsed to a
                  # bare integer and refused if it is anything else. An UNPARSEABLE reading FAILS
                  # rather than warns - "I could not look" must never be reported as "there is
                  # plenty of room", the same rule the unreadable-PVC arm of measure_tree follows.
                  check_disk() {
                    _dd=$(df -Pk /data 2>&1) || {
                      DISK_PCT=unknown
                      say_err "disk check: cannot df /data"
                      echo "       df said: $_dd"
                      return 1
                    }
                    _dp=$(printf '%s\n' "$_dd" | awk 'END { sub(/%$/, "", $5); print $5 }')
                    case "$_dp" in
                      ''|*[!0-9]*)
                        DISK_PCT=unknown
                        say_err "disk check: unparseable use percentage for /data"
                        echo "       df printed: $_dd"
                        return 1 ;;
                    esac
                    DISK_PCT=$_dp
                    # check-ping-bodies: untaint DISK_PCT - df's use percentage, gated to digits by the case above
                    if [ "$DISK_PCT" -ge "$DISK_FAIL_PCT" ]; then
                      say_err "/data is ${DISK_PCT}% full (fail threshold ${DISK_FAIL_PCT}%)"
                      echo "       local-path enforces no quota, so this is the NODE SSD filling."
                      echo "       Retention is deferred until it is under control."
                      return 1
                    fi
                    if [ "$DISK_PCT" -ge "$DISK_WARN_PCT" ]; then
                      echo "WARNING (advisory, does not fail the job) /data is ${DISK_PCT}% full (warn threshold ${DISK_WARN_PCT}%)"
                      return 0
                    fi
                    echo "note: disk ok - /data is ${DISK_PCT}% full"
                    return 0
                  }

                  # ---- 3. EXPECTED SET -------------------------------------------------
                  check_expected() {
                    _rc=0
                    _ok=0
                    _tot=0
                    set -f                      # split the list without glob-expanding it
                    for _e in $EXPECTED_ARTIFACTS; do
                      _tot=$(( _tot + 1 ))
                      _label=${_e%%:*}
                      _rest=${_e#*:}
                      _glob=${_rest%:*}
                      _min=${_rest##*:}
                      _path=$(newest_match "$_glob"); _s=$?
                      case "$_s" in
                        0) if assert_min_size "$_path" "$_label" "$_min"; then
                             # Print what the glob actually resolved to. A retained orphan
                             # directory can satisfy a check the live PVC no longer can; this is
                             # the only place that becomes visible.
                             echo "note: $_label -> $_path"
                             _ok=$(( _ok + 1 ))
                           else
                             _rc=1
                           fi ;;
                        1) say_err "$_label MISSING - nothing matches $_glob"; _rc=1 ;;
                        *) say_err "$_label UNREADABLE - could not stat a match of $_glob"; _rc=1 ;;
                      esac
                    done
                    set +f
                    # Announce the pass explicitly. A gate that prints nothing when it is happy
                    # is indistinguishable from a gate that never ran.
                    ART_OK=$_ok
                    ART_TOT=$_tot
                    echo "note: expected set - $_ok/$_tot artifacts present and above their size floor"
                    return $_rc
                  }

                  # ---- 4. DUMP FRESHNESS -----------------------------------------------
                  check_fresh() {
                    _frc=0
                    _fok=0
                    _ftot=0
                    set -f
                    for _fe in $FRESH_ARTIFACTS; do
                      _ftot=$(( _ftot + 1 ))
                      _flabel=${_fe%%:*}
                      _fglob=${_fe#*:}
                      _fpath=$(newest_match "$_fglob"); _fs=$?
                      case "$_fs" in
                        0) if assert_fresh "$_fpath" "$_flabel"; then
                             echo "note: $_flabel -> $_fpath"
                             _fok=$(( _fok + 1 ))
                           else
                             _frc=1
                           fi ;;
                        1) say_err "$_flabel MISSING - nothing matches $_fglob"; _frc=1 ;;
                        *) say_err "$_flabel UNREADABLE - could not stat a match of $_fglob"; _frc=1 ;;
                      esac
                    done
                    set +f
                    FRESH_OK=$_fok
                    FRESH_TOT=$_ftot
                    echo "note: dump freshness - $_fok/$_ftot artifacts newer than $(( STALE_SECONDS / 3600 ))h"
                    return $_frc
                  }

                  hc_reset
                  emit "summary=starting"
                  ping_hc start
                  rc=0

                  step snapshots
                  restic snapshots || true

                  # Explicit && chaining rather than `set -e` inside a group: errexit is ignored
                  # for any command in an AND-OR list, so a `{ set -e; ... } || rc=$?` block would
                  # keep running after a failure and report the last command's status.
                  {
                    step unlock &&
                    # Removes STALE locks only (no --remove-all). This is what actually recovers
                    # a lock left by a SIGKILLed previous run.
                    restic unlock &&
                    step backup "backup /data" &&
                    restic backup /data \
                      --tag nightly \
                      --exclude='*.tmp' \
                      --exclude='cache/*'
                  } || rc=$?
                  # SNAPSHOT THE ABORT POINT NOW. `step gate` and `step check` below both run
                  # UNCONDITIONALLY, so by the time the ping body is built $STEP is always
                  # `check` - failed_step= would name the integrity check on a night the backup
                  # never ran, next to a restic_check= line asserting that check passed.
                  # FAILED_STEP is only meaningful when rc != 0; the promotion block below
                  # re-points it at whichever phase actually set rc.
                  FAILED_STEP=$STEP

                  # The gate runs AFTER the backup and BEFORE forget --prune. Both halves of that
                  # placement are deliberate:
                  #
                  #   AFTER backup - making the gate a precondition of the backup is the intuitive
                  #   move and it is wrong: one stale influx dump would then skip the entire
                  #   night's backup of everything else, and the backup is worth more than the
                  #   gate. Capturing a bad tree costs one wasted snapshot; skipping a good one
                  #   costs a day.
                  #
                  #   BEFORE forget --prune - this is where homelab deliberately diverges from
                  #   vps/backup/restic-cronjob.yaml, which runs its gate last. Failing the job
                  #   after pruning still alerts, but the seven good daily snapshots are already
                  #   being expired on schedule while the alert goes unread. Skipping retention on
                  #   an unverified tree makes the destruction impossible rather than merely
                  #   noticed. The cost of a false positive is a repository that grows in B2 until
                  #   somebody looks - cheap, and reversible; the cost of the false negative is
                  #   every recovery point. Do not "simplify" this back into the chain above.
                  step gate "backup verification gate"
                  # NOW is sampled here, not at script start: the backup above can run for hours,
                  # and an age measured against a stale clock reading would silently loosen the
                  # freshness threshold.
                  NOW=$(date +%s)
                  gate_rc=0
                  check_mount    || gate_rc=1
                  measure_tree   || gate_rc=1
                  check_scale    || gate_rc=1
                  check_disk     || gate_rc=1
                  check_expected || gate_rc=1
                  check_fresh    || gate_rc=1

                  prune_rc=0
                  if [ "$rc" -eq 0 ] && [ "$gate_rc" -eq 0 ]; then
                    {
                      step forget "forget + prune" &&
                      # --group-by paths is LOAD-BEARING. restic forget defaults to grouping by
                      # host+paths, and every CronJob pod has a unique hostname, so each nightly
                      # snapshot landed in a group of its own and the policy below kept ALL of
                      # them: verified 2026-08-20 with 137 snapshots in 137 groups across 131
                      # hostnames, zero ever pruned. Grouping by paths alone makes the retention
                      # policy actually apply.
                      restic forget --prune \
                        --group-by paths \
                        --keep-daily 7 \
                        --keep-weekly 4 \
                        --keep-monthly 6
                    } || prune_rc=$?
                    # Three states, not two. `skipped` has to keep meaning "the gate deferred
                    # retention on purpose; the repository grows until the gate goes green" -
                    # benign, self-describing, safe to leave alone. A prune that STARTED and died
                    # may have partially expired snapshots and wants looking at tonight, and
                    # `skipped` is the one reading that makes an operator not look.
                    if [ "$prune_rc" -ne 0 ]; then PRUNE=failed; else PRUNE=ran; fi
                  else
                    PRUNE=skipped
                    echo "==> forget + prune SKIPPED"
                    echo "    Retention is deferred on purpose. Expiring daily snapshots against a"
                    echo "    tree that failed verification (or a backup that failed outright) is"
                    echo "    precisely how seven good recovery points get replaced by seven"
                    echo "    snapshots of nothing. The repository grows until this is fixed."
                  fi

                  # Integrity of the repository is worth knowing either way.
                  check_rc=0
                  step check
                  restic check || check_rc=$?
                  # `not-reached` is the INITIAL value and must stay reachable only when this line
                  # never runs. A check that ran and failed is `failed`, never `not-reached`.
                  if [ "$check_rc" -ne 0 ]; then RESTIC_CHECK=failed; else RESTIC_CHECK=ok; fi

                  # Preserve the most specific failure. A real restic failure keeps its own exit
                  # code; the gate only promotes to failure when nothing else already did.
                  if [ "$rc" -eq 0 ]; then
                    if [ "$prune_rc" -ne 0 ]; then
                      rc=$prune_rc
                      FAILED_STEP=forget
                    elif [ "$check_rc" -ne 0 ]; then
                      rc=$check_rc
                      FAILED_STEP=check
                    elif [ "$gate_rc" -ne 0 ]; then
                      rc=$gate_rc
                      FAILED_STEP=gate
                    fi
                  fi

                  echo "==> done (exit $rc)"

                  # ---- ping body ----------------------------------------------------
                  # Built AFTER the exit status is final and AFTER the promotion block
                  # above, and never inside an && chain or an rc-determining pipeline:
                  # this gate's `du` exits non-zero routinely (sqlite WAL files,
                  # rotating logs) and that status is deliberately tolerated, so
                  # weaving an emit into the chain would manufacture a nightly false
                  # red on a healthy backup. Every value here is a number the gate had
                  # already computed. NOTHING CAPTURED, EVER.
                  #
                  # "shape gate passed" is deliberate wording. This gate proves SHAPE
                  # only: every homelab PVC is copied live with no quiesce step, and a
                  # retained orphan directory from a recreated PVC can satisfy an
                  # expected-set entry the live PVC no longer can. A bare "8/8
                  # artifacts" would read as content verification and make the body
                  # more confident than the check it reports on.
                  TREE_GIB=$(awk -v k="$TREE_KIB" 'BEGIN{printf "%.2f", k/1048576}' 2>/dev/null) || TREE_GIB=unknown
                  case "$TREE_GIB" in ''|*[!0-9.]*) TREE_GIB=unknown ;; esac
                  # check-ping-bodies: untaint TREE_GIB - awk formatting of TREE_KIB, gated to digits and dots by the case above
                  if [ "$rc" -eq 0 ]; then
                    emit "summary=ok - shape gate passed: $ART_OK/$ART_TOT artifacts, $FRESH_OK/$FRESH_TOT dumps fresh, $TREE_DIRS PVC dirs, $TREE_GIB GiB"
                  elif [ "$FAILED_STEP" = gate ] && [ "$MOUNT_OK" = no ]; then
                    emit "summary=FAILED rc=$rc - SSD not mounted; /data is the bare mountpoint"
                    emit "failed_step=gate"
                  # FAILED_STEP is `gate` only when the gate is what set rc, which requires
                  # restic to have succeeded. A restic failure therefore always reaches the
                  # branch below and can never be reported as a gate failure.
                  elif [ "$FAILED_STEP" = gate ]; then
                    emit "summary=FAILED rc=$rc - shape gate failed"
                    emit "failed_step=gate"
                  else
                    # restic's own failure - the commonest real failure of this job (a
                    # B2 outage, a credential rotation, a lock conflict, a corrupt
                    # pack). NOTHING CAPTURED - not because a repository URI is
                    # sensitive (it is not), but because output this script did not
                    # construct cannot be classified at runtime.
                    emit "summary=FAILED rc=$rc - restic exited non-zero"
                    emit "failed_step=$FAILED_STEP"
                    emit "error=restic exited non-zero; see pod log"
                  fi
                  emit "mount_ok=$MOUNT_OK"
                  emit "pvc_dirs=$TREE_DIRS"
                  emit "tree_kib=$TREE_KIB"
                  # local-path has no quota, so this is the field that says whether the node
                  # SSD every PVC shares is about to fill. It is emitted on every run, green or
                  # red, so the trend is readable before a threshold is crossed.
                  emit "disk_pct=$DISK_PCT"
                  emit "artifacts=$ART_OK/$ART_TOT"
                  emit "dumps_fresh=$FRESH_OK/$FRESH_TOT"
                  # The highest-value single field in this body: this job defers
                  # `forget --prune` whenever the gate fails, and the repository then
                  # grows in B2 until somebody looks. This field is somebody looking.
                  emit "prune=$PRUNE"
                  emit "restic_check=$RESTIC_CHECK"
                  flush_errors

                  ping_hc "$rc"
                  exit $rc
              env:
                # healthchecks.io check UUID (op://Homelab/b2-restic/healthcheck-uuid).
                # Substituted by envsubst at apply time; never committed.
                - name: HC_UUID
                  value: "${RESTIC_HC_UUID}"
              envFrom:
                - secretRef:
                    name: restic-b2
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
          volumes:
            - name: data
              hostPath:
                path: /var/mnt/ssd/local-path-provisioner
                type: Directory
