apiVersion: batch/v1
kind: Job
metadata:
  name: restic-init
  namespace: backup
spec:
  backoffLimit: 0
  # A Job's spec.template is immutable, so a completed Job that is never
  # garbage collected blocks every later apply that changes it. Required on
  # every one-shot Job here; the rule and the incident behind it are in
  # AGENTS.md, and `make check-job-ttl` enforces it.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restic
          image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
          # The script is homelab/backup/scripts/restic-init.sh, mounted at
          # /scripts by the configMapGenerator in this directory's
          # kustomization.yaml. It is deliberately NOT shared with the VPS
          # copy: the two clusters use different envsubst allowlists, so one
          # file cannot be safe in both trees. See the script's header.
          command: ["sh", "/scripts/restic-init.sh"]
          envFrom:
            - secretRef:
                name: restic-b2
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: backup-scripts }
