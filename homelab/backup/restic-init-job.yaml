apiVersion: batch/v1
kind: Job
metadata:
  name: restic-init
  namespace: backup
spec:
  backoffLimit: 0
  # A Job's spec.template is immutable, so a completed Job that is never
  # garbage collected blocks every later apply that changes it. Required on
  # every one-shot Job here; the rule and the incident behind it are in
  # AGENTS.md, and `make check-job-ttl` enforces it.
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restic
          image: restic/restic:0.17.3
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              if restic snapshots >/dev/null 2>&1; then
                echo "Repository already initialized."
              else
                echo "Initializing restic repository..."
                # Idempotent: the Job's TTL deletes it, so every later apply recreates
                # it. A bare `restic init` then fails against the existing repo and
                # leaves a Failed Job behind on each apply. Probing first makes a
                # re-run a clean no-op, and a genuine init failure still fails loudly.
                if restic cat config >/dev/null 2>&1; then
                  echo "Repo already initialized - nothing to do."
                else
                  # Idempotent: the Job's TTL deletes it, so every later apply recreates
              # it. A bare `restic init` then fails against the existing repo and
              # leaves a Failed Job behind on each apply. Probing first makes a
              # re-run a clean no-op, and a genuine init failure still fails loudly.
              if restic cat config >/dev/null 2>&1; then
                echo "Repo already initialized - nothing to do."
              else
                restic init
              fi
                fi
              fi
          envFrom:
            - secretRef:
                name: restic-b2
