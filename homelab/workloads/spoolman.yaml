apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spoolman-data
  namespace: printing
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoolman
  namespace: printing
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: spoolman } }
  template:
    metadata:
      labels: { app: spoolman }
    spec:
      containers:
        - name: spoolman
          image: ghcr.io/donkie/spoolman:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: "/api/v1/spool?limit=1", port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /home/app/.local/share/spoolman }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: spoolman-data }
---
apiVersion: v1
kind: Service
metadata:
  name: spoolman
  namespace: printing
spec:
  selector: { app: spoolman }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spoolman
  namespace: printing
spec:
  ingressClassName: traefik
  rules:
    - host: spoolman.cynexia.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spoolman
                port:
                  number: 8000
