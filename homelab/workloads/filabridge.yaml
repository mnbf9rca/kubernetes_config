apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filabridge-data
  namespace: printing
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filabridge
  namespace: printing
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: filabridge } }
  template:
    metadata:
      labels: { app: filabridge }
    spec:
      containers:
        - name: filabridge
          image: ghcr.io/sargonas/filabridge:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 5000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: filabridge-data }
---
apiVersion: v1
kind: Service
metadata:
  name: filabridge
  namespace: printing
spec:
  selector: { app: filabridge }
  ports:
    - { name: http, port: 5000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: filabridge
  namespace: printing
spec:
  ingressClassName: traefik
  rules:
    - host: filabridge.cynexia.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: filabridge
                port:
                  number: 5000
