apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netdisco-postgres-data, namespace: netdisco }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 10Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: netdisco-dumps, namespace: netdisco }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netdisco
  namespace: netdisco
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: netdisco } }
  template:
    metadata:
      labels: { app: netdisco }
    spec:
      initContainers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: Always
          restartPolicy: Always
          env:
            - { name: POSTGRES_DB, value: netdisco }
            - { name: POSTGRES_USER, value: netdisco }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: netdisco, key: pg-password } }
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql }
        - name: schema-init
          image: netdisco/netdisco:latest-backend
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -q -h 127.0.0.1 -U netdisco -d netdisco; do sleep 2; done
              exec /home/netdisco/bin/netdisco-env /home/netdisco/bin/netdisco-updatedb.sh
          env: &netdisco-db-env
            - { name: NETDISCO_DB_HOST, value: localhost }
            - { name: NETDISCO_DB_NAME, value: netdisco }
            - { name: NETDISCO_DB_USER, value: netdisco }
            - name: NETDISCO_DB_PASS
              valueFrom: { secretKeyRef: { name: netdisco, key: pg-password } }
            - { name: NETDISCO_CURRENT_PG_VERSION, value: "18" }
            - { name: DEPLOY_ADMIN_USER, value: "NO" }
          volumeMounts: &netdisco-config-mount
            - name: config
              mountPath: /home/netdisco/environments/deployment.yml
              subPath: deployment.yml
              readOnly: true
      containers:
        - name: netdisco-web
          image: netdisco/netdisco:latest-web
          imagePullPolicy: Always
          env: *netdisco-db-env
          ports:
            - { name: http, containerPort: 5000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts: *netdisco-config-mount
        - name: netdisco-backend
          image: netdisco/netdisco:latest-backend
          imagePullPolicy: Always
          env: *netdisco-db-env
          volumeMounts: *netdisco-config-mount
      volumes:
        - name: postgres-data
          persistentVolumeClaim: { claimName: netdisco-postgres-data }
        - name: config
          secret:
            secretName: netdisco
            defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata: { name: netdisco, namespace: netdisco }
spec:
  selector: { app: netdisco }
  ports:
    - { name: http, port: 5000, targetPort: http }
---
apiVersion: v1
kind: Service
metadata: { name: netdisco-postgres, namespace: netdisco }
spec:
  selector: { app: netdisco }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: netdisco-pg-dump, namespace: netdisco }
spec:
  schedule: "25 2 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              image: postgres:18-alpine
              imagePullPolicy: Always
              command: [sh, /scripts/netdisco-pg-dump.sh]
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: netdisco, key: pg-password } }
                - name: PUSH_URL
                  valueFrom: { secretKeyRef: { name: netdisco, key: push-url } }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
                seccompProfile: { type: RuntimeDefault }
              volumeMounts:
                - { name: dumps, mountPath: /dumps }
                - { name: scripts, mountPath: /scripts, readOnly: true }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
          volumes:
            - name: dumps
              persistentVolumeClaim: { claimName: netdisco-dumps }
            - name: scripts
              configMap: { name: netdisco-scripts }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: netdisco, namespace: netdisco }
spec:
  ingressClassName: traefik
  rules:
    - host: netdisco.cynexia.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netdisco
                port: { number: 5000 }
