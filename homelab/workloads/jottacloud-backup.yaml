---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jottacloud-backup-sa
  namespace: jottacloud-backup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jottacloud-backup-config
  namespace: jottacloud-backup
data:
  TZ: "UTC"
  RCLONE_LOG_LEVEL: "INFO"
  RCLONE_CONFIG_FILE: "/config/rclone.conf"
  JOTTA_REMOTE: "jotta"
  LOCAL_PATH: "/data/jotta"
  # Encryption at rest: this one key is the whole switch. The container
  # derives the crypt remote itself (always wrapping LOCAL_PATH, filename
  # encryption off); the raw passphrase arrives via the DEST_REMOTE_PASSWORD
  # key in jottacloud-backup-secrets (make create-jotta-secret). rclone.conf
  # and the live Jottacloud token in it are never touched.
  # Uncomment ONLY per the migration runbook: (1) image with DEST_REMOTE
  # support is live, (2) secret has DEST_REMOTE_PASSWORD, (3) the existing
  # plaintext copy has been migrated to ciphertext (see
  # docs/operations/homelab.md, "Encryption at rest").
  DEST_REMOTE: "jottacrypt"
  KOPIA_CONFIG_FILE: "/config/kopia.config"
  KOPIA_CACHE_DIR: "/config/cache"
  KOPIA_LOG_DIR: "/data/logs/kopia"
  KOPIA_USERNAME: "backup"
  KOPIA_HOSTNAME: "jotta-backup-client"
  SOURCE_PATH: "/data/jotta"
  S3_ENDPOINT: "s3.eu-central-003.backblazeb2.com"
  S3_BUCKET: "cloud-files-backup"
  S3_REGION: "eu-central-003"
  # These two keys drive the `jottacloud-backup` uptime-kuma PUSH monitor, not a
  # healthchecks.io check. The KEY NAMES are fixed by the image
  # (ghcr.io/mnbf9rca/jottacloud-backup, whose scripts/healthcheck-notify.sh
  # joins them with a single `/`); only the values changed, on 2026-08-26.
  #
  # WHAT THAT IMAGE ACTUALLY SENDS, verified against the live endpoint the same
  # day rather than assumed. On success it POSTs to the two keys below joined
  # by a slash (the names are spelled without a leading sigil on purpose: this
  # manifest rides the envsubst stream and one of them is on the allowlist)
  # with the tail of the backup log as the body; kuma's push route accepts the
  # POST (checked with a bogus token: it answered kuma's own
  # `{"ok":false,"msg":"Monitor not found or not active."}`, which only the
  # handler produces) and reads `status` and `msg` from the QUERY STRING, so the
  # body is discarded and the heartbeat lands as `up` with kuma's default
  # message. On failure the image appends `/fail`, and on every run it makes a
  # second POST to `/log`; kuma routes neither, so both answer Express's
  # "Cannot POST" 404. That is the contract this repo wants: a failed backup
  # pushes NOTHING and the monitor goes DOWN by silence at its interval. The
  # cost is a "WARNING: Failed to send..." line per unrouted request: ONE on a
  # successful run, from the `/log` POST alone, and TWO on a failed one, where
  # `/fail` also 404s. Cosmetic, and not a fault — the image logs them and
  # carries on.
  HEALTHCHECK_URL: "https://uptime.cynexia.com/api/push"
  HEALTHCHECK_UUID: "${JOTTACLOUD_KUMA_TOKEN}"
  BACKUP_TIMEOUT: "6h"
  MAX_PARALLEL_UPLOADS: "4"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jottacloud-backup-data-pv
spec:
  capacity: { storage: 2Ti }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: jottacloud-backup-data-nfs
    volumeAttributes:
      server: "10.10.10.1"
      share: "/tank/largeappdata/jottacloud"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jottacloud-backup-data-pvc
  namespace: jottacloud-backup
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  resources: { requests: { storage: 2Ti } }
  volumeName: jottacloud-backup-data-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jottacloud-backup-config-pvc
  namespace: jottacloud-backup
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
  storageClassName: local-path
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jottacloud-backup-scheduled
  namespace: jottacloud-backup
  labels:
    app: jottacloud-backup
spec:
  schedule: "45 */6 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      activeDeadlineSeconds: 21600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: jottacloud-backup
            job-type: scheduled
        spec:
          restartPolicy: Never
          serviceAccountName: jottacloud-backup-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 1999
            runAsGroup: 1999
            fsGroup: 1999
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/mnbf9rca/jottacloud-backup:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1999
                runAsGroup: 1999
                privileged: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: JOB_TYPE
                  value: "scheduled"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: JOB_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['job-name']
              envFrom:
                - configMapRef:
                    name: jottacloud-backup-config
                - secretRef:
                    name: jottacloud-backup-secrets
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: config
                  mountPath: /config
                - name: tmp
                  mountPath: /tmp
                - name: rclone-config-secret
                  mountPath: /tmp/rclone-secret
                  readOnly: true
              resources:
                requests: { memory: "512Mi", cpu: "250m" }
                limits: { memory: "4Gi", cpu: "2000m" }
              # No livenessProbe: the previous one was a verified no-op — backup.sh is PID 1
              # for the whole run and never execs over itself (so the ps|grep always matched),
              # and its /tmp/backup-completed fallback is written by no upstream script. It also
              # measured process presence, not progress, so a stalled rclone looked healthy.
              # activeDeadlineSeconds above is what actually bounds a hung run.
              # See docs/operations/monitoring.md ("Explicitly rejected") for why this was
              # removed rather than fixed.
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: jottacloud-backup-data-pvc
            - name: config
              persistentVolumeClaim:
                claimName: jottacloud-backup-config-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 5Gi
            - name: rclone-config-secret
              secret:
                secretName: jottacloud-backup-secrets
                items:
                  - key: RCLONE_CONFIG
                    path: rclone.conf
