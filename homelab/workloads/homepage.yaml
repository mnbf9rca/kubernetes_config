apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  selector: { matchLabels: { app: homepage } }
  template:
    metadata:
      labels: { app: homepage }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          env:
            - { name: HOMEPAGE_ALLOWED_HOSTS, value: home.cynexia.com }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
              httpHeaders:
                - { name: Host, value: home.cynexia.com }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Later ConfigMap edits need kubectl -n homepage rollout restart deploy/homepage.
            - { name: config, mountPath: /app/config/services.yaml, subPath: services.yaml, readOnly: true }
            - { name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml, readOnly: true }
            - { name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml, readOnly: true }
            - { name: config, mountPath: /app/config/custom.css, subPath: custom.css, readOnly: true }
      volumes:
        - name: config
          configMap: { name: homepage-config }
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector: { app: homepage }
  ports:
    - { name: http, port: 3000, targetPort: http }
