      Reading and automation: { style: row, columns: 4, icon: freshrss.svg }
      Home: { style: row, columns: 4, icon: home-assistant.svg }
      Workshop and printing: { style: row, columns: 4, icon: prusa-research.svg }
      Network: { style: row, columns: 4, icon: mikrotik.svg }
      Infrastructure: { style: row, columns: 4, icon: proxmox.svg }
      Agents: { style: row, columns: 4, icon: hermes-agent-alt.svg }
  custom.css: |
    body {
      background: radial-gradient(circle at 12% 0%, #134e4a66, transparent 32rem),
                  radial-gradient(circle at 90% 12%, #312e8166, transparent 36rem),
                  #0b1220 !important;
      background-attachment: fixed !important;
