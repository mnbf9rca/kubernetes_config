apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cert-manager v1.21.2. The upstream manifest includes its own `cert-manager`
# Namespace definition, so homelab/bootstrap/namespaces.yaml intentionally
# omits it — kustomize would reject a duplicate resource.
# Homelab follows the current cert-manager minor; moved to v1.21.2 on September 30, 2026.

resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml
  - clusterissuer.yaml
  - wildcard-certificate.yaml
