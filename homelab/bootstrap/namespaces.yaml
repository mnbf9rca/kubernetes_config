apiVersion: v1
kind: Namespace
metadata:
  name: downloads
---
apiVersion: v1
kind: Namespace
metadata:
  name: keel
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  labels:
    # Traefik uses hostNetwork + hostPort, which violate PSA baseline
    # (the cluster-wide enforce level). Elevate this namespace to privileged
    # so the DaemonSet pod is allowed to schedule.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: backup
  labels:
    # The restic-backup CronJob mounts /var/mnt/ssd/local-path-provisioner
    # via hostPath so it can back up every local-path PV on the node.
    # hostPath volumes violate PSA baseline (cluster enforce level), so this
    # namespace must run at PSA privileged.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: jottacloud-backup
---
apiVersion: v1
kind: Namespace
metadata:
  name: health
  # PSA baseline (cluster default). Nothing in health uses hostPath/hostNetwork.
  # THIS NAMESPACE BANS NOTHING (operator ruling, 2026-09-06). The update-mode
  # lock is a property of the workload, not of the namespace it sits in.
  # influxdb, grafana, garmin-grafana and influx-backup are pinned and keel-free
  # because each writes into persistent data it owns - an on-disk index, a
  # grafana.db migrated in place, a token cache, the nightly export that is the
  # restore path - and they are named, with those reasons, in the STATEFUL
  # tuple in scripts/check-renovate-scope.py. influxdb-mcp floats on `stable`
  # with the full keel annotation set, needing no exemption from anything: it is
  # a stateless HTTP server built here from homelab/health/mcp/ inputs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ops
  # PSA baseline (cluster default). Two workloads, both outbound-only and
  # neither needing hostPath, hostNetwork, a ServiceAccount or any RBAC:
  #   update-watch  — polls the GitHub REST API for open Renovate pull requests
  #   keel-fresh    — reads keel's in-cluster /metrics for its poll counter and
  #                   tracked-image gauge, and pushes an uptime-kuma monitor
  #
  # It is deliberately NOT in `health` — its scope is the whole repo, and a
  # health-namespace object alerting about other namespaces would be a lie about
  # ownership — and deliberately NOT in `backup`, which runs at PSA privileged
  # for restic's hostPaths that these jobs have no business inheriting.
  #
  # Both are pinned and keel-free by choice rather than by prohibition: neither
  # writes persistent data it owns, so neither is on the STATEFUL lock in
  # scripts/check-renovate-scope.py, and pinning is always allowed. Renovate
  # watches this tree, so bumps arrive as pull requests.
---
apiVersion: v1
kind: Namespace
metadata:
  name: hindsight
  # PSA baseline (cluster default). Nothing in hindsight uses hostPath or
  # hostNetwork, so no elevation and no labels.
  # Every workload here is on the STATEFUL lock in
  # scripts/check-renovate-scope.py, and each earns its place individually: the
  # api and control-plane run forward-only Alembic migrations on startup against
  # an agent's memory, the postgres pod owns the PGDATA, and hindsight-pg-dump
  # writes the dump that is the only rollback. An unattended auto-update is
  # exactly the failure to design out.
  # Renovate proposes the bumps; `make hindsight-upgrade` takes the dump first.
---
apiVersion: v1
kind: Namespace
metadata:
  name: proxy
  # PSA baseline (cluster default), so no labels. tinyproxy needs no hostPath,
  # no hostNetwork, no ServiceAccount and no RBAC - only a ClusterIP the
  # health-namespace cloudflared pod can dial, and ordinary outbound egress.
  #
  # keel runs here: tinyproxy holds no persistent data, so it is on no lock, and
  # its one image floats carrying the full annotation set. Updates arrive on
  # keel's poll and nothing here needs a hand update.
---
# NOTE: cert-manager and local-path-storage namespaces are created by their
# respective upstream manifests, so they're omitted here (kustomize rejects
# duplicate resources). keel's namespace IS declared above because
# homelab/bootstrap/keel/keel.yaml is hand-written (upstream keel moved to
# Helm-only distribution and no longer ships flat manifests), so nothing
# else creates the `keel` namespace for us.
