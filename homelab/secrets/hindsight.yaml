---
# Hindsight (homelab/hindsight/hindsight.yaml). Placeholders only — envsubst fills
# them from 1Password inside a single `op run` child at apply time.
#
# `database-url` is assembled HERE rather than in the Deployment, so the password
# appears in exactly one place and never sits in a plain manifest as a
# `$(VAR)`-style reference. Generate the password URL-safe (alphanumeric): a DSN
# with a percent-encoding question in it is a debugging session nobody needs.
#
# `pg-password` is the same value delivered on its own, because two consumers need
# it outside the DSN — the postgres container reads it as POSTGRES_PASSWORD to
# bootstrap the role, and the nightly dump CronJob reads it as PGPASSWORD.
#
# `llm-api-key` is deliberately PROVIDER-NEUTRAL even though the 1Password field it
# comes from is named `openai-api-key`. Switching from OpenAI to Anthropic or Groq
# is then two env lines in hindsight.yaml plus a new value here, with no key rename
# rippling through the manifest.
#
# `tenant-api-key` has four consumers: the API validates against it, the
# control-plane container presents it to the API as HINDSIGHT_CP_DATAPLANE_API_KEY,
# the canary CronJob authenticates with it, and the three Hermes gateways on VM 103
# send it on every request. The VM does NOT read this value and it is in no .env
# there: the gateways resolve a SECOND vault copy of the same value,
# op://hermes/hindsight/tenant-api-key, through hermes's own 1Password secrets
# provider, into the gateway process environment at startup. Two copies because the
# VM's service account can see only the `hermes` vault. Nothing keeps them in step,
# so ROTATING IT IS NOT FINISHED UNTIL both vault items are updated, the three
# gateways are restarted, and the VM-side smoke test has been re-run — the client
# fails open, so a broken write path after a rotation is silent from the Hermes
# side. The rotation runbook is in docs/operations/hindsight.md.
apiVersion: v1
kind: Secret
metadata: { name: hindsight, namespace: hindsight }
stringData:
  database-url: "postgresql://hindsight:${HINDSIGHT_PG_PASSWORD}@hindsight-postgres.hindsight.svc.cluster.local:5432/hindsight"
  pg-password: "${HINDSIGHT_PG_PASSWORD}"
  llm-api-key: "${HINDSIGHT_LLM_API_KEY}"
  tenant-api-key: "${HINDSIGHT_TENANT_API_KEY}"
  cp-access-key: "${HINDSIGHT_CP_ACCESS_KEY}"
