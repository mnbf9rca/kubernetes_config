---
apiVersion: v1
kind: Secret
metadata: { name: health-influxdb, namespace: health }
stringData:
  admin-password: "${HEALTH_INFLUX_ADMIN_PASSWORD}"
  admin-token: "${HEALTH_INFLUX_ADMIN_TOKEN}"
  garmin-v1-password: "${HEALTH_INFLUX_GARMIN_V1_PASSWORD}"
  ingester-token: "${HEALTH_INFLUX_INGESTER_TOKEN}"
  read-token: "${HEALTH_INFLUX_READ_TOKEN}"
---
apiVersion: v1
kind: Secret
metadata: { name: health-hae, namespace: health }
stringData:
  auth-token: "${HEALTH_HAE_AUTH_TOKEN}"
---
apiVersion: v1
kind: Secret
metadata: { name: health-garmin, namespace: health }
stringData:
  email: "${HEALTH_GARMIN_EMAIL}"
  b64-password: "${HEALTH_GARMIN_B64_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata: { name: health-grafana, namespace: health }
stringData:
  admin-password: "${HEALTH_GRAFANA_ADMIN_PASSWORD}"
---
# Cloudflare analytics ingest (homelab/health/cloudflare-analytics.yaml).
#
# api-token MUST carry Zone.Analytics:Read and nothing else. The job only ever
# reads from Cloudflare, so any edit scope on this token is blast radius bought
# for nothing.
#
# zone-tags is `name=zonetag,name=zonetag`. Zone IDs are not passwords, but they
# identify the account and this repo is public, so they are resolved from
# 1Password at apply time like everything else rather than being committed.
#
# influx-token needs READ AND WRITE on the `cloudflare` bucket: the job's resume
# watermark is max(_time) read back out of the bucket, not a stored cursor.
# Minted by `make health-influx-cloudflare-bootstrap`.
apiVersion: v1
kind: Secret
metadata: { name: health-cloudflare, namespace: health }
stringData:
  api-token: "${HEALTH_CF_API_TOKEN}"
  zone-tags: "${HEALTH_CF_ZONE_TAGS}"
  influx-token: "${HEALTH_INFLUX_CLOUDFLARE_TOKEN}"
