name: safer-reader-broker
version: 1.2.0
description: "Task read and completion broker for the quarantined safer_web_reader profile. Two own-task lifecycle tools and paging of the existing web_extract tool. Profile-scoped overrides hide and refuse built-in kanban tools."
author: cynexia
provides_tools:
  - web_extract
  - safer_reader_task
  - safer_reader_complete
capabilities:
  - tools.override
