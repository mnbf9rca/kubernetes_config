# Installed to /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf on
# VM 103. Canonical copy:
# hermes-vm/etc/systemd/apt-daily-upgrade.timer.d/override.conf in
# github.com/mnbf9rca/kubernetes_config
#
# Debian's default fires this around 06:00 with an hour of jitter. Moved to
# 04:00 so the upgrade completes before the 04:45 automatic reboot set in
# /etc/apt/apt.conf.d/52unattended-upgrades-local - otherwise u-u schedules the
# reboot for the NEXT 04:45, roughly a day later, and a kernel patch sits
# installed-but-not-running for 24 hours.
#
# The empty OnCalendar= is required: without it this ADDS a second schedule
# rather than replacing the vendor one.
#
# THE JITTER IS DELIBERATELY NARROW - 10m, not Debian's hour, and not the 20m
# this file first carried. unattended-upgrade does not reboot directly; it hands
# the literal "04:45" to shutdown, and systemd resolves a time that has ALREADY
# PASSED to the same time TOMORROW. So an upgrade still running at 04:45 does
# not delay the reboot by minutes, it slips it by 24 hours, and the kernel sits
# installed-but-not-running for a day. At 20m the worst-case start was 04:20,
# leaving a 25-minute margin, and a kernel plus initramfs regeneration on a slow
# disk can plausibly fill that. At 10m the margin is 35 minutes. Jitter exists to
# spare shared mirrors a thundering herd; for a single VM it buys nothing worth
# the difference.
#
# FixedRandomDelay makes that offset a constant derived from the machine ID
# rather than a fresh roll each firing. Without it two consecutive runs can land
# less than 24 hours apart, which is the same overrun risk arriving by another
# route.

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=10m
FixedRandomDelay=true
Persistent=true
