# Installed to /etc/systemd/system/apt-daily.timer.d/override.conf on VM 103.
# Canonical copy: hermes-vm/etc/systemd/apt-daily.timer.d/override.conf in
# github.com/mnbf9rca/kubernetes_config
#
# NOT A DUPLICATE OF apt-daily-upgrade.timer.d/override.conf, and not redundant
# with it. The two timers are the two halves of one pipeline, and Debian ships
# them in the wrong order for the schedule this VM runs. apt-daily.timer does
# the `apt-get update` that REFRESHES the package lists. apt-daily-upgrade.timer
# runs `unattended-upgrade`, which installs from the lists ALREADY IN THE CACHE
# and never refreshes them itself. Move only the second and the pipeline
# installs before it downloads.
#
# Debian's default fires apt-daily at 06:00 and 18:00 with up to 12 hours of
# jitter. Against the 04:00 upgrade run, the lists reaching that run could be
# fourteen hours old, so a security advisory published mid-morning would not be
# installed until the FOLLOWING 04:00 - well over a day after release.
#
# THE FAILURE IS SILENT, which is why the schedule is pinned rather than left to
# jitter. unattended-upgrade writes
# /var/lib/apt/periodic/unattended-upgrades-stamp on a run that found NOTHING TO
# DO just as readily as on one that installed everything - verified in the 2.12
# source, which passes update_stamp=True on both the "All upgrades installed"
# path and the "No packages found that can be upgraded unattended" one. So the
# weekly update runbook's stamp-age precondition
# (`docs/operations/hermes-vm-updates.md`), which stops the session when the
# stamp is more than 14 days old, stays green over a machine that has patched
# nothing at all, and nothing else would report it.
#
# 03:30 is clear of everything the cluster does to this VM: the hermes-pull
# backup SSHes in at 02:00 and is done well before 02:30, the 03:00 restic sweep
# does not touch this VM, and 03:30 leaves a 20-minute margin before the 04:00
# upgrade even at full jitter.
#
# The empty OnCalendar= is required: without it this ADDS a second schedule
# rather than replacing the vendor one. FixedRandomDelay matches the upgrade
# timer beside it, so the gap between refresh and install is a constant for this
# machine rather than re-rolled on every firing.

[Timer]
OnCalendar=
OnCalendar=*-*-* 03:30
RandomizedDelaySec=10m
FixedRandomDelay=true
Persistent=true
