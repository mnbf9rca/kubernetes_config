# Managed scope: pinned for EVERY Hermes profile on this VM, current and future.
# Copy of record: hermes-vm/etc/hermes/config.yaml in the kubernetes_config repo.
# Core honors these three pins; the profile helper mirrors them for external
# WebUI, whose runtime reader bypasses managed scope.
# Image and volumes stay per-profile so security_reviewer keeps its scanner
# image and isolated workers do not gain shared attachments or other mounts.
# Trusted profiles retain the shared WebUI attachments stopgap until its removal
# condition in docs/operations/hermes-vm.md is independently verified.
terminal:
  backend: docker
  docker_run_as_host_user: true
  cwd: /workspace
