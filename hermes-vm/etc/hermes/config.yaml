# Managed scope: pinned for EVERY Hermes profile on this VM, current and future.
# Copy of record: hermes-vm/etc/hermes/config.yaml in the kubernetes_config repo.
# Source of record; CLI reads enforce these keys, but 5575a08 multiplex terminal
# scopes bypass managed config. Mirror these four keys with the profile helper
# --policy-only until upstream build_profile_terminal_scope honors this layer.
# terminal.docker_volumes is deliberately NOT pinned: it stays per-profile so only
# default/emh/hal carry the shared WebUI attachments mount (see hermes-vm docs; remove
# that mount when hermes-webui PR #7022 is deployed). Profiles without docker_volumes
# get the platform auto-mounted per-profile sandbox workspace.
terminal:
  backend: docker
  docker_image: nousresearch/hermes-sandbox:desktop
  docker_run_as_host_user: true
  cwd: /workspace
