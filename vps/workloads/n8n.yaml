apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: vps
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
      # Disable automatic service env var injection. By default Kubernetes
      # injects `<SERVICE_UPPER>_PORT=tcp://<clusterIP>:<port>` for every
      # Service in the namespace into every container's env. Our Service
      # is named `n8n`, which produces `N8N_PORT=tcp://...` — collides
      # with n8n's own N8N_PORT config var (expects integer) and produces
      # "Invalid number value for N8N_PORT" on startup. n8n falls back
      # to the default 5678 but the noise is real. Same class of bug
      # could bite any workload whose Service name matches a prefix of
      # one of its own config env vars.
      enableServiceLinks: false
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          env:
            - name: N8N_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: n8n, key: N8N_ENCRYPTION_KEY } }
            - { name: N8N_HOST, value: n8n.cynexia.com }
            - { name: N8N_PROTOCOL, value: https }
            - { name: WEBHOOK_URL, value: "https://n8n.cynexia.com/" }
            - { name: GENERIC_TIMEZONE, value: Europe/London }
          ports:
            - containerPort: 5678
          # Liveness and readiness are deliberately split (spec §4 P2):
          # /healthz is a shallow "the HTTP server is answering" check,
          # /healthz/readiness additionally gates on the database. Gating
          # liveness on the DB would turn a transient sqlite lock into a
          # crashloop; gating readiness on it correctly drops n8n out of
          # Service routing until the DB is usable again.
          # The startupProbe deliberately targets /healthz/readiness, NOT
          # /healthz. n8n registers /healthz in init() immediately after
          # server.listen(), BEFORE migrations run, and returns 200
          # unconditionally — so a startup probe on /healthz succeeds on its
          # first poll and buys exactly zero migration budget, while readiness
          # (503 until migrated) would drop n8n from the Service for the whole
          # migration with no grace, and `strategy: Recreate` makes that a hard
          # 502 window. Gating startup on the same endpoint readiness uses
          # gives migrations the full 5 min before either of the other probes
          # is allowed to act.
          startupProbe:
            httpGet: { path: /healthz/readiness, port: 5678 }
            periodSeconds: 10
            failureThreshold: 30 # 5 min budget for migrations
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 5678 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /healthz/readiness, port: 5678 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /home/node/.n8n }
        - name: sqlite-snapshot
          image: alpine:3.20
          # The script is vps/workloads/scripts/sqlite-snapshot.sh, mounted at
          # /scripts by the configMapGenerator in this directory's
          # kustomization.yaml. It is SHARED with the other single-database
          # sqlite sidecars; the only per-app difference is $SNAPSHOT_DB below.
          # Its `set -e is deliberately absent` reasoning lives in the script,
          # next to the loop it governs.
          command: ["sh", "/scripts/sqlite-snapshot.sh"]
          env:
            - { name: SNAPSHOT_DB, value: /data/database.sqlite }
          # NO PROBES OF ANY KIND ON THIS SIDECAR — the freshness liveness
          # probe that used to live here was DELIBERATELY REMOVED. Do not add
          # it back.
          #
          # Its original justification was self-healing: a failed `apk add`
          # left the container with no sqlite3, and a restart repaired that.
          # The loop above now retries `apk add` itself on a 5 min backoff, so
          # that justification is gone — against a transient fault the probe
          # would only duplicate what the loop already does.
          #
          # Against a PERMANENT fault (corrupt DB, disk full, a path that
          # moved under an upgrade) it is actively harmful: it restarts a
          # container that restarting cannot repair, the restarts back off
          # into CrashLoopBackOff, a container that is not Running is not
          # Ready, and a Pod with a non-Ready container is dropped from its
          # EndpointSlice — so n8n goes offline, at cloudflared, because a
          # backup failed. That is the same outage the spec refused sidecar
          # readiness probes to avoid (§4 P1, §6), and it is the spec's own
          # rule (§2): if restarting cannot plausibly fix the failure, a probe
          # is the wrong instrument.
          #
          # Detection is not lost, it moves to the artifact where it belongs.
          # The restic verification gate asserts that a per-app snapshot
          # exists and is fresh, and pings healthchecks.io red otherwise.
          # Latency goes from ~45 min to at worst a day, which is the right
          # scale for a backup fault and buys immunity from ever taking an
          # application offline for one.
          #
          # This also matches umami's pg-dump-sidecar, which has no probe for
          # the same reason — the consistency is deliberate, not an oversight.
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: n8n-data }
        - name: scripts
          configMap: { name: sqlite-snapshot-scripts }
