apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-data
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-extensions
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: freshrss
  namespace: vps
spec:
  selector:
    app: freshrss
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - name: freshrss
          image: freshrss/freshrss:latest
          env:
            - { name: TZ, value: Europe/London }
            - { name: CRON_MIN, value: "*/15" }
          ports:
            - containerPort: 80
          # Upstream's own cli/health.php target. The trailing slash is
          # load-bearing: index.php 301-redirects a non-empty PATH_INFO, so
          # /api (no slash) probes a redirect rather than the health handler.
          # Note this endpoint
          # never opens the DB and feed refresh runs from a separate crond —
          # a dead cron serves 200 here forever (spec §5).
          livenessProbe:
            httpGet: { path: /api/, port: 80 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /api/, port: 80 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /var/www/FreshRSS/data }
            - { name: extensions, mountPath: /var/www/FreshRSS/extensions }
        - name: sqlite-snapshot
          image: alpine:3.24
          # The script is vps/workloads/scripts/sqlite-snapshot-freshrss.sh,
          # mounted at /scripts by the configMapGenerator in this directory's
          # kustomization.yaml. FreshRSS keeps one DB per user, so it iterates a
          # glob rather than taking a $SNAPSHOT_DB like the other three. Its
          # `set -e is deliberately absent` reasoning lives in the script.
          command: ["sh", "/scripts/sqlite-snapshot-freshrss.sh"]
          # NO PROBES OF ANY KIND ON THIS SIDECAR — the freshness liveness
          # probe that used to live here was DELIBERATELY REMOVED. Do not add
          # it back.
          #
          # Its original justification was self-healing: a failed `apk add`
          # left the container with no sqlite3, and a restart repaired that.
          # The loop above now retries `apk add` itself on a 5 min backoff, so
          # that justification is gone — against a transient fault the probe
          # would only duplicate what the loop already does.
          #
          # Against a PERMANENT fault (corrupt DB, disk full, a path that
          # moved under an upgrade) it is actively harmful: it restarts a
          # container that restarting cannot repair, the restarts back off
          # into CrashLoopBackOff, a container that is not Running is not
          # Ready, and a Pod with a non-Ready container is dropped from its
          # EndpointSlice — so FreshRSS goes offline, at cloudflared, because a
          # backup failed. That is the same outage the spec refused sidecar
          # readiness probes to avoid (§4 P1, §6), and it is the spec's own
          # rule (§2): if restarting cannot plausibly fix the failure, a probe
          # is the wrong instrument.
          #
          # Detection is not lost, it moves to the artifact where it belongs.
          # The restic verification gate asserts that a PER-USER snapshot
          # exists and is fresh, and pings healthchecks.io red otherwise.
          # Latency goes from ~45 min to at worst a day, which is the right
          # scale for a backup fault and buys immunity from ever taking an
          # application offline for one.
          #
          # This also matches umami's pg-dump-sidecar, which has no probe for
          # the same reason — the consistency is deliberate, not an oversight.
          volumeMounts:
            - { name: data, mountPath: /var/www/FreshRSS/data }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: freshrss-data }
        - name: extensions
          persistentVolumeClaim: { claimName: freshrss-extensions }
        - name: scripts
          configMap: { name: sqlite-snapshot-scripts }
