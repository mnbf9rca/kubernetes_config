apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-data
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: vps
spec:
  selector:
    app: uptime-kuma
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      # Kubernetes otherwise injects UPTIME_KUMA_PORT=tcp://<clusterIP>:3001
      # from our own Service, which the image's deprecated healthcheck script
      # parses as an integer and chokes on — a known upstream footgun. Same
      # class of collision as n8n's N8N_PORT.
      enableServiceLinks: false
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2
          imagePullPolicy: Always
          env:
            - { name: TZ, value: Europe/London }
            # Closes the "green but monitoring nothing" path. On a recreated
            # or empty PVC, uptime-kuma starts its setup wizard, which binds
            # the SAME port 3001 and answers /api/entry-page with HTTP 200
            # ({"type":"setup-database"}) — so all three probes below go green
            # while zero monitors are running. This is the external monitoring
            # layer, so that is the worst state it can silently occupy.
            # Pinning the DB type skips the database-selection step.
            - { name: UPTIME_KUMA_DB_TYPE, value: sqlite }
          ports:
            - containerPort: 3001
          # /api/entry-page is unauthenticated JSON, but be honest about how
          # shallow it is: it serves an in-memory `server.entryPage` and its
          # only DB touch is a memoised `trustProxy` lookup, so in the steady
          # state it reads nothing at all. It does NOT detect the dangerous
          # failure either: the HTTP server
          # and the monitor scheduler are independent (upstream #4967), so a
          # uptime-kuma that has silently stopped monitoring still answers 200
          # here. That is covered by the layer-4 dead-man's-switch (spec §5).
          startupProbe:
            httpGet: { path: /api/entry-page, port: 3001 }
            periodSeconds: 10
            failureThreshold: 30 # 5 min budget for migrations
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/entry-page, port: 3001 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /api/entry-page, port: 3001 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /app/data }
        - name: sqlite-snapshot
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            # No output suppression, an explicit busy timeout and an atomic
            # publish. The original form swallowed every failure mode
            # (`apk add ... >/dev/null` with no set -e, `|| true` on the
            # sqlite3 call), so it could produce no snapshot forever while the
            # pod stayed Ready. See spec §4 P1. This snapshot is also the only
            # backup of the hand-created uptime-kuma monitor config.
            #
            # `set -e` is DELIBERATELY ABSENT — do not "harden" it back in.
            # If this sidecar exits, kubelet restarts it, the retry is
            # immediate, and a persistent fault (SQLITE_BUSY past the 30s
            # timeout, disk full, a corrupt page, an apk/CDN blip) becomes
            # CrashLoopBackOff. A container that is not Running is not Ready,
            # which makes the whole POD not Ready, which drops uptime-kuma from its
            # EndpointSlice and 502s it at cloudflared — a backup fault taking
            # the application offline. That is exactly the outage the spec
            # rejected sidecar readiness probes to avoid (§4 P1, §6), and
            # exiting is strictly worse because the snapshotter stops running
            # too. Instead: log loudly to stderr, back off 5 min, keep going.
            # Detecting "no fresh snapshot" is not this container's job at
            # all — it belongs to the restic verification gate, which reports
            # it to healthchecks.io without ever touching Pod readiness. See
            # the comment on the (deliberately absent) probes below.
            #
            # "No source DB present" is likewise a tolerated state, not an
            # error: on a fresh volume the app has not created its database
            # yet, so there is genuinely nothing to snapshot. The loop logs
            # and re-polls every 5 min. That tolerance is not a hole — an
            # empty or wrongly-mounted volume is caught by the restic gate.
            - |
              set -u
              DB=/app/data/kuma.db

              # Publish a snapshot only if it actually contains a schema. A
              # 0-byte or truncated source makes `.backup` succeed and emit a
              # structurally valid but EMPTY database with a current mtime —
              # which sails straight through the restic staleness gate,
              # because mtime is the only property that gate checks.
              # `count(*) from sqlite_master` is a schema-only read, cheap
              # enough to run every cycle against a live DB.
              snapshot() {
                src=$1
                tmp="$src.restic.tmp"
                if ! sqlite3 -cmd '.timeout 30000' "$src" ".backup $tmp"; then
                  rm -f "$tmp"
                  return 1
                fi
                objs=$(sqlite3 "$tmp" 'select count(*) from sqlite_master' 2>/dev/null)
                case "$objs" in
                  ''|*[!0-9]*) objs=0 ;;
                esac
                if [ "$objs" -lt 1 ]; then
                  echo "ERROR: snapshot of $src has no schema objects - refusing to publish" >&2
                  rm -f "$tmp"
                  return 1
                fi
                mv "$tmp" "$src.restic"
              }

              while true; do
                if ! command -v sqlite3 >/dev/null 2>&1; then
                  if ! apk add --no-cache sqlite; then
                    echo "ERROR: apk add sqlite failed; retrying in 5m" >&2
                    sleep 300
                    continue
                  fi
                fi
                if [ ! -f "$DB" ]; then
                  echo "no source DB at $DB yet - nothing to snapshot; retrying in 5m"
                  sleep 300
                  continue
                fi
                if snapshot "$DB"; then
                  sleep 43200
                else
                  echo "ERROR: snapshot of $DB failed; retrying in 5m" >&2
                  sleep 300
                fi
              done
          # NO PROBES OF ANY KIND ON THIS SIDECAR — the freshness liveness
          # probe that used to live here was DELIBERATELY REMOVED. Do not add
          # it back.
          #
          # Its original justification was self-healing: a failed `apk add`
          # left the container with no sqlite3, and a restart repaired that.
          # The loop above now retries `apk add` itself on a 5 min backoff, so
          # that justification is gone — against a transient fault the probe
          # would only duplicate what the loop already does.
          #
          # Against a PERMANENT fault (corrupt DB, disk full, a path that
          # moved under an upgrade) it is actively harmful: it restarts a
          # container that restarting cannot repair, the restarts back off
          # into CrashLoopBackOff, a container that is not Running is not
          # Ready, and a Pod with a non-Ready container is dropped from its
          # EndpointSlice — so uptime-kuma goes offline, at cloudflared, because a
          # backup failed. That is the same outage the spec refused sidecar
          # readiness probes to avoid (§4 P1, §6), and it is the spec's own
          # rule (§2): if restarting cannot plausibly fix the failure, a probe
          # is the wrong instrument.
          #
          # Detection is not lost, it moves to the artifact where it belongs.
          # The restic verification gate asserts that a per-app snapshot
          # exists and is fresh, and pings healthchecks.io red otherwise.
          # Latency goes from ~45 min to at worst a day, which is the right
          # scale for a backup fault and buys immunity from ever taking an
          # application offline for one.
          #
          # This also matches umami's pg-dump-sidecar, which has no probe for
          # the same reason — the consistency is deliberate, not an oversight.
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: uptime-kuma-data }
