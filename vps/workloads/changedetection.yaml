apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: changedetection
  namespace: vps
spec:
  selector:
    app: changedetection
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: sockpuppetbrowser
  namespace: vps
spec:
  selector:
    app: sockpuppetbrowser
  ports:
    - port: 3000
      targetPort: 3000
---
# sockpuppetbrowser is the canonical upstream browser backend for
# changedetection.io — dgtlmoon's own Chrome+playwright wrapper. We
# replaced the plan's browserless/chrome:latest because that image is
# deprecated v1 (unmaintained for 2 years), and running modern
# Playwright against it leaks CDP sessions under load.
#
# Sockpuppetbrowser launches chrome with --no-sandbox +
# --disable-dev-shm-usage by default, so it runs cleanly under PSA
# baseline without SYS_ADMIN capability (the compose docs' SYS_ADMIN
# hint is from before those chrome flags were added to server.py).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sockpuppetbrowser
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sockpuppetbrowser
  template:
    metadata:
      labels:
        app: sockpuppetbrowser
    spec:
      containers:
        - name: sockpuppetbrowser
          image: dgtlmoon/sockpuppetbrowser:latest
          env:
            # Only four env vars are documented upstream — see
            # https://github.com/dgtlmoon/changedetection.io/blob/master/docker-compose.yml
            - { name: SCREEN_WIDTH, value: "1920" }
            - { name: SCREEN_HEIGHT, value: "1024" }
            - { name: SCREEN_DEPTH, value: "16" }
            - { name: MAX_CONCURRENT_CHROME_PROCESSES, value: "10" }
          ports:
            - containerPort: 3000
            # kubelet-only stats listener. Deliberately NOT added to the
            # Service — kubelet dials the pod IP directly.
            - { containerPort: 8080, name: stats }
          # NEVER httpGet port 3000: it is a websockets listener and rejects a
          # plain GET with 426 Upgrade Required, which is outside 200-399, so
          # the probe would fail permanently and restart-loop the pod. /stats
          # on :8080 shares the asyncio event loop with the CDP server, so a
          # wedged loop fails it (spec §4 P2). A tcpSocket on :3000 is NOT an
          # equivalent — the kernel completes handshakes from the backlog while
          # the event loop is fully blocked, so it detects process death only
          # (spec §6).
          startupProbe:
            httpGet: { path: /stats, port: 8080 }
            periodSeconds: 10
            failureThreshold: 12 # 2 min budget
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /stats, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /stats, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            # Steady state is FETCH_WORKERS=4 chromes on the changedetection
            # side driving 4 concurrent sessions here — roughly 150 MiB per
            # chrome. Cap at 1.5Gi for headroom against occasional bursts.
            requests:
              memory: 512Mi
            limits:
              memory: 1500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
    spec:
      containers:
        - name: changedetection
          image: ghcr.io/dgtlmoon/changedetection.io:latest
          env:
            # Env vars lifted from the operational Coolify container
            # config on 2026-04-14 (non-Coolify-specific ones only).
            - { name: PLAYWRIGHT_DRIVER_URL, value: "ws://sockpuppetbrowser.vps.svc.cluster.local:3000" }
            - { name: BASE_URL, value: "https://watch.cynexia.com" }
            - { name: FETCH_WORKERS, value: "4" }
            - { name: MINIMUM_SECONDS_RECHECK_TIME, value: "3" }
            - { name: HIDE_REFERER, value: "true" }
            - { name: DISABLE_VERSION_CHECK, value: "true" }
            - { name: LOGGER_LEVEL, value: "DEBUG" }
            - { name: SCREENSHOT_MAX_HEIGHT, value: "16000" }
            - { name: TZ, value: "Europe/London" }
            # DO NOT set HTTP_PROXY / HTTPS_PROXY. The homelab egress proxy is
            # live again - `homelab-proxy` on port 8888, a cloudflared access
            # client reaching tinyproxy over the homelab cloudflared tunnel
            # (`cynexia-health`) - but it is assigned PER WATCH from
            # changedetection's own settings, never from the environment. An
            # environment proxy would route every fetch through a cross-cluster
            # chain, including the ones that already work directly, which is
            # slower and has more ways to fail. The watches that need the
            # residential exit address carry
            # http://homelab-proxy.vps.svc.cluster.local:8888 in their proxy
            # field. See docs/operations/vps.md.
          ports:
            - containerPort: 5000
          # There is no upstream HEALTHCHECK (open since 2022) and the image
          # ships neither curl nor wget, so httpGet / is the available check.
          # A 302-on-auth counts as probe success, so this survives enabling a
          # password. It does NOT detect the real risk here: upstream #4214,
          # where the scheduling ticker died and 134 watches went 23 days
          # unchecked while / returned 200. That needs an external json-query
          # alert on overdue_watches from /api/v1/systeminfo — never liveness,
          # because a restart does not fix a scheduling bug (spec §5).
          startupProbe:
            httpGet: { path: /, port: 5000 }
            periodSeconds: 10
            failureThreshold: 12 # 2 min budget
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 5000 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /, port: 5000 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /datastore }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: changedetection-data }
