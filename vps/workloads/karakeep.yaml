apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-data
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-meilisearch
  namespace: vps
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: vps
spec:
  selector:
    app: karakeep
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: vps
spec:
  selector:
    app: meilisearch
  ports:
    - port: 7700
      targetPort: 7700
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: vps
  # NO keel ANNOTATIONS. Removed 2026-08-26 for the same reason as traefik:
  # `match-tag: "true"` on the pinned v1.41.0 only refreshed the digest, so this
  # was frozen while looking covered.
  #
  # WHY v1.41.0 AND NOT THE LATEST. meilisearch is karakeep's search backend,
  # and the pin is a PAIRING with karakeep rather than a distrust of
  # Meilisearch. karakeep's own docker/docker-compose.yml pins
  # getmeili/meilisearch:v1.41.0, so that is the combination upstream tests;
  # v1.53.1 is untested against karakeep (checked August 28, 2026).
  # renovate.json carries the same hold as an `allowedVersions: "<1.42"` cap
  # with its reason, so v1.41 patches still arrive and the untested bump stops
  # reappearing every session. Move the cap when karakeep moves its compose
  # pin, not before, and read that compose file at the time rather than
  # trusting this note.
  #
  # Moving it is not a tag edit. Meilisearch does not convert a v1.41 index on
  # startup, so the upgrade needs a one-time `--upgrade-db` argument on this
  # container, removed in a follow-up once the index is converted. The
  # alternative is dropping the volume and letting karakeep rebuild the index,
  # which the operator has accepted: it holds a few thousand pages.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.41.0
          imagePullPolicy: Always
          env:
            - { name: MEILI_NO_ANALYTICS, value: "true" }
            - { name: MEILI_ENV, value: production }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: karakeep, key: MEILI_MASTER_KEY } }
          ports:
            - containerPort: 7700
          # /health is the only genuinely deep check of this set — it probes
          # the search queue, task DB and auth store. Liveness is correct
          # here: Meilisearch's `mustRestart` state literally asks to be
          # recycled (spec §4 P2).
          #
          # From v1.43.0 a successful POST /tasks/compact puts /health into
          # that `mustRestart` state. Upstream did that DELIBERATELY, in
          # Meilisearch pull request 6346 (merged April 22, 2026), so that
          # Meilisearch Cloud restarts an instance after compaction. It costs
          # ONE restart, not a loop: the flag is cleared when the process
          # starts again, and a loop would need compaction to re-run on every
          # start. Nothing in this estate calls /tasks/compact — it is an
          # administrative endpoint and karakeep does not issue it — so on
          # v1.41.0 the behaviour is not reachable, and past v1.43.0 it would
          # only fire if someone ran a compaction by hand.
          startupProbe:
            httpGet: { path: /health, port: 7700 }
            periodSeconds: 10
            failureThreshold: 18 # 3 min budget for index recovery
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 7700 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health, port: 7700 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /meili_data }
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: karakeep-meilisearch }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: karakeep
  template:
    metadata:
      labels:
        app: karakeep
    spec:
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:release
          imagePullPolicy: Always
          env:
            # MEILI_MASTER_KEY must come before MEILI_ADDR is consumed.
            # MEILI_MASTER_KEY and NEXTAUTH_SECRET are read by karakeep
            # at startup via process.env, so order within the list is
            # irrelevant for these (unlike umami's DATABASE_URL which
            # used k8s $(VAR) expansion).
            - { name: NEXTAUTH_URL, value: https://keep.cynexia.com }
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: karakeep, key: NEXTAUTH_SECRET } }
            - { name: DATA_DIR, value: /data }
            - { name: DB_WAL_MODE, value: "true" }
            - { name: MEILI_ADDR, value: "http://meilisearch.vps.svc.cluster.local:7700" }
            - name: MEILI_MASTER_KEY
              valueFrom: { secretKeyRef: { name: karakeep, key: MEILI_MASTER_KEY } }
            # Inference (OpenAI). GPT-5 series is vision-capable so the same
            # model serves text + image. INFERENCE_USE_MAX_COMPLETION_TOKENS
            # is required for GPT-5/o-series (uses max_completion_tokens
            # instead of the deprecated max_tokens). Summarization is opt-in
            # and ~doubles per-bookmark cost.
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: karakeep, key: OPENAI_API_KEY } }
            - { name: INFERENCE_TEXT_MODEL, value: "gpt-5-mini" }
            - { name: INFERENCE_IMAGE_MODEL, value: "gpt-5-mini" }
            - { name: INFERENCE_CONTEXT_LENGTH, value: "8192" }
            - { name: INFERENCE_USE_MAX_COMPLETION_TOKENS, value: "true" }
            - { name: INFERENCE_ENABLE_AUTO_SUMMARIZATION, value: "true" }
            - { name: INFERENCE_NUM_WORKERS, value: "4" }
          ports:
            - containerPort: 3000
          # Upstream Dockerfile HEALTHCHECK and the official Helm chart both
          # use /api/health. It is a hardcoded literal in the *web* process
          # and cannot observe the worker at all — stuck-queue incidents
          # (#1802, #2704) all leave it returning 200. The detector for that
          # is the karakeep_queue_jobs metric, not a probe (spec §5).
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            failureThreshold: 30 # 5 min budget for migrations
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - { name: data, mountPath: /data }
        - name: sqlite-snapshot
          image: alpine:3.24
          # The script is vps/workloads/scripts/sqlite-snapshot.sh, mounted at
          # /scripts by the configMapGenerator in this directory's
          # kustomization.yaml. It is SHARED with the other single-database
          # sqlite sidecars; the only per-app difference is $SNAPSHOT_DB below.
          # Its `set -e is deliberately absent` reasoning lives in the script,
          # next to the loop it governs.
          # karakeep is the sharp case: its worker writes this DB continuously,
          # so a busy-timeout failure here is expected, not exotic.
          command: ["sh", "/scripts/sqlite-snapshot.sh"]
          env:
            - { name: SNAPSHOT_DB, value: /data/db.db }
          # NO PROBES OF ANY KIND ON THIS SIDECAR — the freshness liveness
          # probe that used to live here was DELIBERATELY REMOVED. Do not add
          # it back.
          #
          # Its original justification was self-healing: a failed `apk add`
          # left the container with no sqlite3, and a restart repaired that.
          # The loop above now retries `apk add` itself on a 5 min backoff, so
          # that justification is gone — against a transient fault the probe
          # would only duplicate what the loop already does.
          #
          # Against a PERMANENT fault (corrupt DB, disk full, a path that
          # moved under an upgrade) it is actively harmful: it restarts a
          # container that restarting cannot repair, the restarts back off
          # into CrashLoopBackOff, a container that is not Running is not
          # Ready, and a Pod with a non-Ready container is dropped from its
          # EndpointSlice — so karakeep goes offline, at cloudflared, because a
          # backup failed. That is the same outage the spec refused sidecar
          # readiness probes to avoid (§4 P1, §6), and it is the spec's own
          # rule (§2): if restarting cannot plausibly fix the failure, a probe
          # is the wrong instrument.
          #
          # Detection is not lost, it moves to the artifact where it belongs.
          # The restic verification gate asserts that a per-app snapshot
          # exists and is fresh, and pings healthchecks.io red otherwise.
          # Latency goes from ~45 min to at worst a day, which is the right
          # scale for a backup fault and buys immunity from ever taking an
          # application offline for one.
          #
          # This also matches umami's pg-dump-sidecar, which has no probe for
          # the same reason — the consistency is deliberate, not an oversight.
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: karakeep-data }
        - name: scripts
          configMap: { name: sqlite-snapshot-scripts }
