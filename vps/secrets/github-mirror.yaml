# Secrets for the github-mirror CronJob (vps/backup/github-mirror.yaml).
# The B2 key here can list, read, write and HIDE but not delete: that is the
# whole immutability model (docs/operations/github-mirror.md). The key that
# can delete lives in a vault the 1Password service account cannot read.
# The key names below are what the pod sees; they deliberately differ from
# the VPS_* placeholder names so that the mounted scripts never contain an
# envsubst-allowlisted name.
apiVersion: v1
kind: Secret
metadata:
  name: github-mirror
  namespace: backup
type: Opaque
stringData:
  token: ${VPS_GITHUB_PAT}
  AWS_ACCESS_KEY_ID: ${VPS_GHMIRROR_B2_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${VPS_GHMIRROR_B2_KEY}
  RESTIC_REPOSITORY: ${VPS_GHMIRROR_RESTIC_REPOSITORY}
  RESTIC_PASSWORD: ${VPS_GHMIRROR_RESTIC_PASSWORD}
  KUMA_TOKEN: ${VPS_GHMIRROR_KUMA_TOKEN}
