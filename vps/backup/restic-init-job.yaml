# One-shot Job to initialize the restic repo in B2. Safe to re-run because
# Idempotent: it probes for an existing repo and only initializes if absent,
# so re-running after the Job's TTL expires is a clean no-op rather than a
# Failed Job on every apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: restic-init
  namespace: backup
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restic
          image: restic/restic:0.17.3
          command: ["sh", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Initializing restic repo at $RESTIC_REPOSITORY"
              # Idempotent: the Job's TTL deletes it, so every later apply recreates
              # it. A bare `restic init` then fails against the existing repo and
              # leaves a Failed Job behind on each apply. Probing first makes a
              # re-run a clean no-op, and a genuine init failure still fails loudly.
              if restic cat config >/dev/null 2>&1; then
                echo "Repo already initialized - nothing to do."
              else
                restic init
              fi
              echo "Done."
          envFrom:
            - secretRef:
                name: restic-b2
