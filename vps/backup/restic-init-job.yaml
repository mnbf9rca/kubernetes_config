# One-shot Job to initialize the restic repo in B2. Safe to re-run because
# Idempotent: it probes for an existing repo and only initializes if absent,
# so re-running after the Job's TTL expires is a clean no-op rather than a
# Failed Job on every apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: restic-init
  namespace: backup
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: restic
          image: restic/restic:0.17.3
          # The script is vps/backup/scripts/restic-init.sh, mounted at
          # /scripts by the configMapGenerator in this directory's
          # kustomization.yaml. It is deliberately NOT shared with the homelab
          # copy: the two clusters use different envsubst allowlists, so one
          # file cannot be safe in both trees. See the script's header.
          command: ["sh", "/scripts/restic-init.sh"]
          env:
            # The repository URL again, under a name that is in NEITHER
            # envsubst allowlist, purely so the script can log it. The script
            # cannot write `$RESTIC_REPOSITORY`: that name is allowlisted for
            # the homelab cluster, and a generated script that mentions it
            # would have the real B2 URL substituted into a ConfigMap. Same
            # Secret key, so this is a rename, not a second copy of the value.
            - name: REPO_DISPLAY
              valueFrom: { secretKeyRef: { name: restic-b2, key: RESTIC_REPOSITORY } }
          envFrom:
            - secretRef:
                name: restic-b2
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: scripts
          # backup-init-scripts, NOT backup-scripts: this Job's spec.template is
          # immutable, so it must not carry the CronJob's script in its hash.
          # See vps/backup/kustomization.yaml.
          configMap: { name: backup-init-scripts }
