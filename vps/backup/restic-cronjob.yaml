apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-backup
  namespace: backup
spec:
  schedule: "0 4 * * *"
  # Without timeZone the schedule is interpreted in kube-controller-manager's
  # local zone, which is not something this repo controls.
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  # Tolerate up to an hour of controller/node downtime before a missed run is
  # written off entirely.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Hard ceiling on a hung B2 connection. Without this, concurrencyPolicy
      # Forbid silently skips every subsequent night. 4h is an opening guess —
      # resize it from the durations healthchecks.io records.
      activeDeadlineSeconds: 14400
      backoffLimit: 1
      # 3 days, so a Friday-night failure is still forensically available on
      # Monday morning.
      ttlSecondsAfterFinished: 259200
      template:
        spec:
          # The `data` hostPath below is /var/mnt/data/local-path-provisioner,
          # which is the Talos user volume on the Hetzner Cloud Volume — and
          # that volume is attached to exactly one machine. Since the
          # 2026-08-28 three-node expansion this pod would otherwise be
          # schedulable onto a CX23 that has no such path.
          #
          # `type: Directory` on the mount means an unpinned pod on the wrong
          # node fails to start rather than backing up an empty tree, so this
          # selector converts a nightly hard failure into no failure at all. It
          # is NOT the thing that prevents backing up nothing — the hostPath
          # type is. Do not remove either one.
          #
          # If this node is ever rebuilt under a different name, the pod goes
          # Pending, the job hits activeDeadlineSeconds, and the missing
          # healthchecks.io start ping alarms. Loud, by design.
          nodeSelector:
            kubernetes.io/hostname: ubuntu-16gb-fsn1-2
          restartPolicy: Never
          # No terminationGracePeriodSeconds override. A longer grace period is
          # only useful if the process can act on SIGTERM, and this one cannot:
          # busybox ash runs as PID 1 and neither forwards TERM to the running
          # restic child nor acts on it while a foreground child is running
          # (verified in restic/restic:0.17.3 - a TERM trap in the child never
          # fired). `exec`ing restic to make it PID 1 is not available either:
          # the wrapper has to outlive it to send the exit-code ping. So a grace
          # period would just burn its full length before the inevitable SIGKILL
          # on every deadline hit, node drain and `kubectl delete`, and the lock
          # would still be left behind. What actually recovers the lock is the
          # `restic unlock` at the head of the next run (below).
          containers:
            - name: restic
              # Pinned to match homelab. Was :latest — an unpinned backup tool
              # is a silent-change surface on the one job you cannot re-run.
              image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
              # The script is vps/backup/scripts/restic-backup.sh, mounted at
              # /scripts by the configMapGenerator in this directory's
              # kustomization.yaml. The backup verification gate lives in
              # there too — its rationale, its maintenance contract (a new
              # sqlite-backed service must be added to EXPECTED_SNAPSHOTS) and
              # the reason it runs LAST rather than as a precondition are all
              # documented at the point of use.
              command: ["sh", "/scripts/restic-backup.sh"]
              env:
                # healthchecks.io check UUID (op://VPS/b2-restic/healthcheck-uuid).
                # Substituted by envsubst at apply time; never committed.
                - name: HC_UUID
                  value: "${VPS_RESTIC_HC_UUID}"
              envFrom:
                - secretRef:
                    name: restic-b2
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: data
              hostPath:
                path: /var/mnt/data/local-path-provisioner
                type: Directory
            - name: scripts
              configMap: { name: backup-scripts }
