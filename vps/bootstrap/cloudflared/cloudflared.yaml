apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: vps
data:
  config.yaml: |
    tunnel: cynexia-vps
    credentials-file: /etc/cloudflared/creds/credentials.json
    no-autoupdate: true
    metrics: 0.0.0.0:2000
    ingress:
      # Workload rules are added to this block as services migrate.
      # Catchall MUST be last.
      - hostname: rss.cynexia.com
        service: http://freshrss.vps.svc.cluster.local:80
      - hostname: uptime.cynexia.com
        service: http://uptime-kuma.vps.svc.cluster.local:3001
      - hostname: watch.cynexia.com
        service: http://changedetection.vps.svc.cluster.local:5000
      - hostname: analytics.cynexia.com
        service: http://umami.vps.svc.cluster.local:3000
      - hostname: n8n.cynexia.com
        service: http://n8n.vps.svc.cluster.local:5678
      - hostname: keep.cynexia.com
        service: http://karakeep.vps.svc.cluster.local:3000
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: vps
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 24h"
spec:
  # Two replicas since the 2026-08-28 three-node expansion. cloudflared is the
  # cluster's ONLY ingress, so a single replica meant every hostname went dark
  # for the length of a node reboot. Cloudflare supports several connectors
  # sharing one named tunnel and one credentials file; both pods read the same
  # cloudflared-credentials Secret and the same cloudflared-config ConfigMap.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Surge-only. maxUnavailable: 0 means a rollout never drops below two
      # serving connectors, and maxSurge: 1 gives it a third pod to start
      # first. With required anti-affinity that surge pod needs a third free
      # node — so while one node is down for a reboot, a rollout STALLS with a
      # Pending pod instead of shedding a live one. Stalling is the failure
      # mode to want here.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      affinity:
        podAntiAffinity:
          # REQUIRED, not preferred. A preferred rule lets both replicas land
          # on one node under scheduling pressure, which reproduces the exact
          # single-point-of-failure the second replica removes — and does it
          # silently, because the Deployment still reports 2/2 ready.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared
              topologyKey: kubernetes.io/hostname
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yaml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yaml
              subPath: config.yaml
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
          # Same shape as the homelab health-tunnel cloudflared: readiness sheds
          # routing at 30s, liveness only restarts at 60s. A tunnel reconnects on its
          # own, so the old failureThreshold: 1 restarted the pod on a single slow
          # /ready response.
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6     # 60s to restart — strictly laxer than readiness below
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3     # 30s to unready
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: creds
          secret:
            secretName: cloudflared-credentials
---
# A node drain is how a rolling Talos or Kubernetes upgrade evicts pods, and
# the whole point of the three-node control plane is that those upgrades roll.
# Without this budget a drain can evict the only cloudflared pod it happens to
# find, and with two replicas on two nodes an operator draining both in quick
# succession takes the tunnel down entirely. minAvailable: 1 makes the second
# drain block until a replacement is Ready.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: vps
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared
