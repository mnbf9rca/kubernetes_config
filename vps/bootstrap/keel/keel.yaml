---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keel
  namespace: keel
---
# Deliberately narrower than upstream's reference manifest: `secrets` (rule 1) and
# `pods/portforward` (rule 3) were removed on 2026-08-26. keel only reads Secrets to
# find imagePullSecrets, and this repo uses none, so the grant bought nothing while
# giving a :latest-tagged, self-updating controller cluster-wide read of every Secret.
# Do not restore them from upstream without a registry credential that actually needs it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: keel
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, watch, list]
  - apiGroups: ["", extensions, apps, batch]
    resources: [pods, replicasets, replicationcontrollers, statefulsets, deployments, daemonsets, jobs, cronjobs]
    verbs: [get, delete, watch, list, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: keel
subjects:
  - kind: ServiceAccount
    name: keel
    namespace: keel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
  namespace: keel
  labels: { app: keel }
  # keel watches its own Deployment so it self-updates too. Same annotations
  # as every other Deployment in the cluster.
  annotations:
    keel.sh/policy: force
    keel.sh/match-tag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 6h"
spec:
  replicas: 1
  selector:
    matchLabels: { app: keel }
  template:
    metadata:
      labels: { app: keel }
    spec:
      serviceAccountName: keel
      containers:
        - name: keel
          image: ghcr.io/keel-hq/keel:latest
          imagePullPolicy: Always
          command: [/bin/keel]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POLL
              value: "true"
            - name: NOTIFICATION_LEVEL
              value: info
            - name: INSECURE_REGISTRY
              value: "false"
          ports:
            - containerPort: 9300
              name: http
          # Readiness sheds routing at 30s; liveness only restarts at 90s. keel polls
          # registries every 6h, so nothing here is urgent and an eager restart risks
          # interrupting an in-flight image update.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6     # 90s to restart — strictly laxer than readiness below
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3     # 30s to unready
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
