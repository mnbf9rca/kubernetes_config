apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/rancher/local-path-provisioner/deploy?ref=v0.0.37

patches:
  # The provisioner spawns helper-pods with hostPath volumes to create/remove
  # PVC directories on the node. hostPath is forbidden under the cluster-wide
  # PSA `baseline` default, so elevate the namespace to `privileged`.
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
  # Since the 2026-08-28 three-node expansion, /var/mnt/data only exists on
  # ubuntu-16gb-fsn1-2 — it is the Talos user volume backed by the Hetzner
  # Cloud Volume, and it is the only path the nightly restic job backs up.
  # The other two control planes are CX23s with no Cloud Volume.
  #
  # So the catch-all is gone. An explicit entry names the storage node, and the
  # DEFAULT entry carries `paths: []`, which makes the provisioner refuse.
  #
  # That refusal rests on the CODE, not on the README. Upstream documents the
  # empty-paths refusal only for an explicitly LISTED node; for the DEFAULT
  # entry it is undocumented behaviour that happens to be correct. In
  # local-path-provisioner v0.0.31, provisioner.go:236 falls back to the
  # DEFAULT entry's paths for a non-listed node and provisioner.go:243 then
  # returns `no local path available on node %v` when that list is empty, so
  # provisioning fails before the helper pod is ever created;
  # canonicalizeStorageClassConfig accepts an empty Paths list, so the config
  # reloads cleanly rather than being rejected. Re-check both call sites on any
  # local-path-provisioner upgrade.
  #
  # Combined with the StorageClass's WaitForFirstConsumer binding mode, a PVC
  # whose consumer is scheduled anywhere else stays Pending with a provisioning
  # error on the PVC — loud, and recoverable — instead of silently binding to
  # unbacked-up ephemeral disk.
  #
  # If the Cloud Volume ever moves to a different node, this list and the
  # nodeSelector in vps/backup/restic-cronjob.yaml must change together.
  - target:
      kind: ConfigMap
      name: local-path-config
      namespace: local-path-storage
    patch: |-
      - op: replace
        path: /data/config.json
        value: |
          {
            "nodePathMap": [
              {
                "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
                "paths": []
              },
              {
                "node": "ubuntu-16gb-fsn1-2",
                "paths": ["/var/mnt/data/local-path-provisioner"]
              }
            ]
          }
  - target:
      kind: Deployment
      name: local-path-provisioner
      namespace: local-path-storage
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  # The v0.0.37 base added a liveness, a readiness and a startup probe to the
  # provisioner and set `timeoutSeconds` on none of them, so all three run at
  # the API default of one second. This estate's rule is that every probe sets
  # `timeoutSeconds` explicitly, because one second false-positives on a loaded
  # node — upstream's silence satisfies the letter of that rule and defeats its
  # purpose.
  #
  # The probes themselves are kept. The provisioner is stateless, so a restart
  # is a safe remedy; what is not acceptable is the trigger. This is the only
  # storage provisioner on a small shared VPS and it is single-replica, so a
  # /health response that arrives slowly under load restarts it and stalls
  # volume provisioning for the whole cluster. Five seconds is this estate's
  # usual figure and leaves upstream's failure thresholds alone.
  #
  # If a later base renames or drops one of these probes, `op: add` against a
  # parent path that no longer exists fails the render by name. That is the
  # wanted behaviour: read the new probe set rather than silently going back to
  # a one-second timeout.
  - target:
      kind: Deployment
      name: local-path-provisioner
      namespace: local-path-storage
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 5
      - op: add
        path: /spec/template/spec/containers/0/startupProbe/timeoutSeconds
        value: 5
  # Mark the upstream StorageClass as default and switch to Retain reclaim
  # policy so accidental PVC deletion doesn't nuke the underlying data —
  # matches the homelab cluster's discipline.
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
      - op: replace
        path: /reclaimPolicy
        value: Retain
